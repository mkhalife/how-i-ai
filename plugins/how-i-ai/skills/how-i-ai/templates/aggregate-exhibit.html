<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How we use AI — an exhibit</title>
<script id="how-i-ai-data" type="application/json">__HOW_I_AI_DATA__</script>
<style>
/* ---------------------------------------------------------------
   Tokens. Risograph: 2–3 inks on off-white paper.
   Categorical + ordinal ramps validated with the dataviz validator
   (light surface #f6f1e6, dark surface #191712) — do not eyeball-edit.
   --------------------------------------------------------------- */
:root {
  color-scheme: light;
  --paper:        #f6f1e6;
  --paper-2:      #efe8d8;
  --card:         #fffdf7;
  --ink:          #17140e;
  --ink-2:        #56503f;
  --ink-3:        #857c66;
  --rule:         #d6cbb2;
  --rule-soft:    #e6ddc9;

  /* categorical: identity of a function. fixed order, never cycled. */
  --s1: #d4452a; --s2: #1b5fb0; --s3: #0f8f63; --s4: #8a4fbf;
  --s5: #b07a00; --s6: #c2518a; --s7: #0d8fa8; --s8: #6b7d1a;

  /* ordinal: ask → make → do (an ordered axis, one hue, light→dark) */
  --a-ask:  #c9a469;
  --a-make: #a2732c;
  --a-do:   #5e3f12;
  --on-ask:  #17140e;
  --on-make: #fffdf7;
  --on-do:   #fffdf7;

  --grain: 0.055;
  --shadow: 0 1px 0 var(--rule-soft), 0 12px 28px -22px rgba(23,20,14,.6);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --paper:     #191712;
    --paper-2:   #13120e;
    --card:      #232019;
    --ink:       #f6f1e3;
    --ink-2:     #c0b7a1;
    --ink-3:     #8d8471;
    --rule:      #3d382c;
    --rule-soft: #2c281f;
    --s1: #e4603f; --s2: #5a92e2; --s3: #2fa478; --s4: #a276d8;
    --s5: #b5851a; --s6: #cf6a94; --s7: #2599b4; --s8: #849629;
    --a-ask:  #6b4a1e;
    --a-make: #a87d3c;
    --a-do:   #e6cb96;
    --on-ask:  #f6f1e3;
    --on-make: #17140e;
    --on-do:   #17140e;
    --grain: 0.05;
    --shadow: 0 1px 0 #2c281f, 0 14px 30px -24px #000;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper:     #191712;
  --paper-2:   #13120e;
  --card:      #232019;
  --ink:       #f6f1e3;
  --ink-2:     #c0b7a1;
  --ink-3:     #8d8471;
  --rule:      #3d382c;
  --rule-soft: #2c281f;
  --s1: #e4603f; --s2: #5a92e2; --s3: #2fa478; --s4: #a276d8;
  --s5: #b5851a; --s6: #cf6a94; --s7: #2599b4; --s8: #849629;
  --a-ask:  #6b4a1e;
  --a-make: #a87d3c;
  --a-do:   #e6cb96;
  --on-ask:  #f6f1e3;
  --on-make: #17140e;
  --on-do:   #17140e;
  --grain: 0.05;
  --shadow: 0 1px 0 #2c281f, 0 14px 30px -24px #000;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background-color: var(--paper);
  background-image:
    radial-gradient(rgba(128,110,70,var(--grain)) 1px, transparent 1.1px),
    radial-gradient(rgba(128,110,70,calc(var(--grain) * .7)) 1px, transparent 1.1px);
  background-size: 7px 7px, 11px 11px;
  background-position: 0 0, 4px 5px;
  color: var(--ink);
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  overflow-x: hidden;
}
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px 72px; }
@media (min-width: 900px) { .wrap { padding: 0 40px 96px; } }

.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
}
.serif { font-family: ui-serif, Georgia, "Times New Roman", serif; }

/* ---- section scaffolding ---- */
section { padding: 40px 0; border-top: 1px solid var(--rule); }
section:first-of-type { border-top: 0; }
@media (min-width: 900px) { section { padding: 60px 0; } }
.label { color: var(--ink-3); margin: 0 0 18px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.label b { color: var(--ink-2); font-weight: 700; }
h2.sec {
  font-size: clamp(26px, 5.2vw, 46px); line-height: 1.02; letter-spacing: -.025em;
  font-weight: 800; margin: 0 0 8px; text-wrap: balance;
}
.sec-note { color: var(--ink-2); max-width: 62ch; margin: 0 0 26px; font-size: 15px; }

/* ---- masthead ---- */
header.masthead { padding: 44px 0 32px; }
@media (min-width: 900px) { header.masthead { padding: 76px 0 40px; } }
.kicker { color: var(--ink-3); margin: 0 0 22px; }
h1 {
  font-size: clamp(44px, 12.5vw, 138px);
  line-height: .86; letter-spacing: -.045em; font-weight: 800;
  margin: 0 0 22px; text-wrap: balance;
  text-shadow: 3px 3px 0 color-mix(in srgb, var(--s1) 22%, transparent);
}
h1 em { font-style: normal; color: var(--s1); }
.masthead-meta {
  display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: baseline;
  border-top: 3px solid var(--ink); padding-top: 14px; color: var(--ink-2);
}
.masthead-meta span { white-space: nowrap; }
.masthead-meta b { color: var(--ink); }

/* ---- wall text ---- */
.walltext { max-width: 48ch; }
.walltext .head {
  font-size: clamp(24px, 4.6vw, 40px); line-height: 1.12; font-weight: 400;
  letter-spacing: -.012em; margin: 0 0 16px; text-wrap: balance;
}
.walltext .body { font-size: clamp(16px, 2.2vw, 19px); line-height: 1.6; color: var(--ink-2); margin: 0; }

/* ---- statements ---- */
.statements { list-style: none; margin: 0; padding: 0; }
.statements li {
  border-top: 1px solid var(--rule-soft); padding: 18px 0;
  display: grid; grid-template-columns: 1fr; gap: 6px;
}
.statements li:first-child { border-top: 0; }
.statement {
  font-size: clamp(25px, 5.6vw, 52px); line-height: 1.02; font-weight: 800;
  letter-spacing: -.03em; margin: 0; text-wrap: balance;
}
.statement .who { color: var(--fc, var(--s1)); }
.statement-sub { color: var(--ink-3); }

/* ---- triptych ---- */
.triptych { display: grid; gap: 18px; grid-template-columns: 1fr; }
@media (min-width: 720px) { .triptych { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 1020px) { .triptych { grid-template-columns: repeat(3, 1fr); } }
.portrait {
  background: var(--card); border: 1px solid var(--rule); border-radius: 4px;
  padding: 20px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 16px;
}
.portrait .top-rule { height: 8px; background: var(--fc); margin: -20px -20px 0; border-radius: 3px 3px 0 0; }
.portrait h3 {
  font-size: clamp(24px, 3.4vw, 32px); line-height: 1; letter-spacing: -.03em;
  font-weight: 800; margin: 4px 0 0; text-wrap: balance;
}
.portrait .who-meta { color: var(--ink-3); margin-top: 6px; }
.p-figures { display: flex; gap: 22px; flex-wrap: wrap; }
.figure .v { font-size: 30px; font-weight: 800; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.figure .k { color: var(--ink-3); margin-top: 6px; display: block; max-width: 16ch; }
.block-head { color: var(--ink-3); margin: 0 0 9px; }
.catlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
.catlist li { display: grid; gap: 4px; }
.catlist .row { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; font-size: 14px; }
.catlist .row span:last-child { color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.track { height: 8px; border-radius: 4px; background: var(--paper-2); overflow: hidden; }
.track i { display: block; height: 100%; border-radius: 0 4px 4px 0; background: var(--fc); }

/* ---- stacked ask/make/do bar ---- */
.stack { display: flex; width: 100%; gap: 2px; }
.stack .seg { min-width: 3px; cursor: default; }
.stack .seg:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.stack-labels { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 9px; font-size: 12px; color: var(--ink-2); }
.stack-labels span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.stack-labels i { width: 10px; height: 10px; border-radius: 2px; flex: none; }

/* ---- assist legend ---- */
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; margin: 0 0 22px; padding: 0; list-style: none; }
.legend li { display: inline-flex; align-items: center; gap: 7px; color: var(--ink-2); font-size: 13px; }
.legend .sw { width: 13px; height: 13px; border-radius: 3px; flex: none; }
.legend .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }

/* ---- surprise wall ---- */
.wall { columns: 1; column-gap: 16px; }
@media (min-width: 620px) { .wall { columns: 2; } }
@media (min-width: 1020px) { .wall { columns: 3; } }
.tile {
  break-inside: avoid; -webkit-column-break-inside: avoid; page-break-inside: avoid;
  background: var(--card); border: 1px solid var(--rule); border-radius: 3px;
  padding: 18px; margin: 0 0 16px; box-shadow: var(--shadow);
  transform: rotate(var(--rot, 0deg)); transition: transform .18s ease;
  border-left: 5px solid var(--fc);
}
.tile:hover { transform: rotate(0deg) translateY(-3px); }
.tile .chip { display: inline-flex; align-items: center; gap: 7px; color: var(--ink-2); margin-bottom: 12px; }
.tile .chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--fc); flex: none; }
.tile p {
  margin: 0 0 14px; font-size: clamp(17px, 2.4vw, 21px); line-height: 1.24;
  font-weight: 700; letter-spacing: -.015em; text-wrap: pretty;
}
.tile .foot { color: var(--ink-3); border-top: 1px solid var(--rule-soft); padding-top: 10px; display: block; }

/* ---- charts ---- */
.chart { width: 100%; display: block; overflow: visible; }
.chart text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
figure { margin: 0; }
figcaption { color: var(--ink-2); font-size: 14px; margin-top: 14px; }
figcaption b { color: var(--ink); font-variant-numeric: tabular-nums; }
.strip-card, .spotlight {
  background: var(--card); border: 1px solid var(--rule); border-radius: 4px;
  padding: 20px; box-shadow: var(--shadow);
}
@media (min-width: 900px) { .strip-card, .spotlight { padding: 28px; } }

/* ---- spotlight ---- */
.spotlight { display: grid; gap: 26px; }
@media (min-width: 900px) { .spotlight { grid-template-columns: 1.05fr 1fr; gap: 40px; align-items: start; } }
.spotlight .big { font-size: clamp(30px, 6vw, 58px); line-height: .98; font-weight: 800; letter-spacing: -.035em; margin: 6px 0 14px; text-wrap: balance; }
.spotlight .lede { color: var(--ink-2); margin: 0 0 20px; font-size: 16px; max-width: 46ch; }
.subcats { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; margin: 0; padding: 0; }
.subcats li {
  border: 1px solid var(--rule); border-radius: 999px; padding: 6px 12px;
  color: var(--ink-2); font-size: 13px; background: var(--paper);
}
.subcats li b { color: var(--ink); font-variant-numeric: tabular-nums; }

/* ---- patterns ---- */
.patterns { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.patterns li {
  display: grid; grid-template-columns: 44px 1fr; gap: 14px; align-items: baseline;
  border-top: 1px solid var(--rule-soft); padding: 18px 0;
}
.patterns li .n { color: var(--s1); font-weight: 800; font-variant-numeric: tabular-nums; }
.patterns li p { margin: 0; font-size: clamp(17px, 2.6vw, 24px); line-height: 1.24; letter-spacing: -.015em; text-wrap: pretty; }
blockquote.oneliner {
  margin: 0 0 30px; padding: 0 0 0 20px; border-left: 5px solid var(--s1);
  font-size: clamp(21px, 3.8vw, 34px); line-height: 1.16; letter-spacing: -.02em;
  font-weight: 400; text-wrap: balance;
}

/* ---- numbers band ---- */
.band {
  background: var(--ink); color: var(--paper); border-radius: 5px;
  padding: 26px 20px; display: grid; gap: 24px 24px;
  grid-template-columns: repeat(auto-fit, minmax(132px, 1fr));
}
@media (min-width: 900px) { .band { padding: 36px 32px; } }
.band > div { min-width: 0; }
.band .v {
  font-size: clamp(26px, 3.6vw, 40px); font-weight: 800; letter-spacing: -.035em;
  line-height: 1.02; font-variant-numeric: tabular-nums;
  overflow-wrap: break-word; hyphens: none;
}
.band .v.long { font-size: clamp(19px, 2vw, 22px); letter-spacing: -.015em; line-height: 1.12; }
.band .k { color: color-mix(in srgb, var(--paper) 62%, transparent); margin-top: 8px; display: block; }

/* ---- table view ---- */
details.numbers { margin-top: 34px; border-top: 1px solid var(--rule); padding-top: 18px; }
details.numbers summary { cursor: pointer; color: var(--ink-2); }
details.numbers summary:hover { color: var(--ink); }
.tables { display: grid; gap: 28px; margin-top: 22px; }
.tables table { max-width: 780px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
caption { text-align: left; color: var(--ink-3); padding-bottom: 8px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
th, td { text-align: left; padding: 7px 10px 7px 0; border-bottom: 1px solid var(--rule-soft); vertical-align: top; }
th { color: var(--ink-2); font-weight: 600; white-space: nowrap; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; padding-right: 0; }

/* ---- tooltip ---- */
#tip {
  position: fixed; z-index: 50; pointer-events: none; opacity: 0;
  transition: opacity .1s ease; background: var(--ink); color: var(--paper);
  padding: 9px 11px; border-radius: 4px; font-size: 12px; line-height: 1.45;
  max-width: 260px; box-shadow: 0 10px 24px -14px rgba(0,0,0,.8);
}
#tip b { font-weight: 700; }
#tip .t-k { color: color-mix(in srgb, var(--paper) 60%, transparent); }

footer {
  border-top: 3px solid var(--ink); margin-top: 52px; padding-top: 16px;
  color: var(--ink-3); display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: space-between;
}
.empty { color: var(--ink-3); font-size: 15px; }

@media print {
  body { background: #fff; }
  .tile, .portrait, .strip-card, .spotlight { box-shadow: none; }
  section { break-inside: avoid; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
  .tile { transform: none; }
}
</style>
</head>

<script>
(function () {
  "use strict";

  /* ============================ data ============================ */
  var DATA = {};
  try {
    DATA = JSON.parse(document.getElementById('how-i-ai-data').textContent) || {};
  } catch (e) { DATA = {}; }

  var arr = function (v) { return Array.isArray(v) ? v : []; };
  var obj = function (v) { return (v && typeof v === 'object' && !Array.isArray(v)) ? v : {}; };
  var num = function (v) { return (typeof v === 'number' && isFinite(v)) ? v : 0; };
  var str = function (v) { return (typeof v === 'string' && v.trim()) ? v.trim() : ''; };

  var team = obj(DATA.team);
  var totals = obj(DATA.totals);
  var windowInfo = obj(DATA.window);
  var distribution = obj(DATA.distribution);
  var participants = arr(distribution.participants);
  var spread = obj(distribution.sessions_per_week_per_person);
  var byFunction = arr(DATA.by_function).filter(function (f) { return str(f && f.function); });
  var byCategory = arr(DATA.by_category);
  var byAssist = arr(DATA.by_assist_type);
  var bySource = arr(DATA.by_source);
  var byMode = arr(DATA.by_mode);
  var byWeek = arr(DATA.by_week);
  var byWeekday = arr(DATA.by_weekday);
  var byHour = arr(DATA.by_hour);
  var tools = arr(DATA.tools);
  var connectors = arr(DATA.connectors);
  var surprises = arr(DATA.surprises).filter(function (s) { return str(s && s.paraphrase); });
  var highlights = obj(DATA.highlights);
  var narrative = obj(DATA.narrative);

  /* ========================= formatting ========================= */
  function fmt(n) {
    n = num(n);
    if (Math.abs(n) >= 1000) return Math.round(n).toLocaleString('en-US');
    if (Number.isInteger(n)) return String(n);
    return (Math.round(n * 10) / 10).toLocaleString('en-US');
  }
  function pct(x) { return Math.round(num(x) * 100) + '%'; }
  function plural(n, one, many) { return num(n) === 1 ? one : (many || one + 's'); }
  function titleish(s) { return str(s); }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function fmtDate(iso) {
    var s = str(iso).slice(0, 10);
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
    if (!m) return s;
    var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return months[parseInt(m[2], 10) - 1] + ' ' + parseInt(m[3], 10);
  }
  function hourLabel(h) {
    h = ((num(h) % 24) + 24) % 24;
    if (h === 0) return '12am';
    if (h === 12) return '12pm';
    return (h < 12 ? h + 'am' : (h - 12) + 'pm');
  }
  function maxBy(list, key) {
    var best = null;
    arr(list).forEach(function (d) {
      if (!d) return;
      if (best === null || num(d[key]) > num(best[key])) best = d;
    });
    return best;
  }
  function maxKey(o) {
    var best = null, bestV = -Infinity;
    Object.keys(obj(o)).forEach(function (k) {
      if (num(o[k]) > bestV) { bestV = num(o[k]); best = k; }
    });
    return best === null ? null : { key: best, value: bestV };
  }
  function sum(o, keys) {
    return keys.reduce(function (a, k) { return a + num(obj(o)[k]); }, 0);
  }

  /* ===================== functions & color ====================== */
  // Stable identity order: by_function order first, then any function that only
  // shows up in participants / surprises. Color follows the entity, never rank.
  var functionOrder = [];
  function noteFunction(name) {
    name = str(name);
    if (name && functionOrder.indexOf(name) === -1) functionOrder.push(name);
  }
  byFunction.forEach(function (f) { noteFunction(f.function); });
  arr(team.by_function).forEach(function (f) { noteFunction(f && f.function); });
  participants.forEach(function (p) { noteFunction(p && p.function); });
  surprises.forEach(function (s) { noteFunction(s && s.function); });

  var SLOTS = 8;
  function fnColor(name) {
    var i = functionOrder.indexOf(str(name));
    if (i < 0) return 'var(--ink-3)';
    return 'var(--s' + ((i % SLOTS) + 1) + ')';
  }
  var ASSIST = [
    { type: 'ask',  label: 'Asked',  color: 'var(--a-ask)',  on: 'var(--on-ask)',  verb: 'ask' },
    { type: 'make', label: 'Made',   color: 'var(--a-make)', on: 'var(--on-make)', verb: 'make' },
    { type: 'do',   label: 'Did',    color: 'var(--a-do)',   on: 'var(--on-do)',   verb: 'do' }
  ];
  function assistLabel(type) {
    var found = null;
    byAssist.forEach(function (a) { if (str(a && a.type) === type) found = str(a.label); });
    if (found) return found;
    var d = null;
    ASSIST.forEach(function (a) { if (a.type === type) d = a.label; });
    return d || type;
  }

  var sourceLabels = {};
  bySource.forEach(function (s) {
    if (str(s && s.source)) sourceLabels[s.source] = str(s.label) || str(s.source);
  });
  function sourceLabel(key) {
    key = str(key);
    if (!key) return '';
    if (sourceLabels[key]) return sourceLabels[key];
    return key.replace(/[-_]/g, ' ').replace(/\b\w/g, function (c) { return c.toUpperCase(); });
  }

  /* ================== typographic statements ==================== */
  // Built from the data: which assist_type dominates a function, and which
  // category leads it. Falls back to a noun phrase when no verb is detectable.
  var VERBS = {
    write: 1, build: 1, debug: 1, fix: 1, review: 1, explain: 1, research: 1,
    plan: 1, analyze: 1, analyse: 1, design: 1, prototype: 1, communicate: 1,
    automate: 1, critique: 1, summarize: 1, summarise: 1, test: 1, ship: 1,
    learn: 1, draft: 1, translate: 1, code: 1, edit: 1, read: 1, search: 1,
    organize: 1, organise: 1, brainstorm: 1, decide: 1, measure: 1, model: 1,
    refactor: 1, document: 1, scope: 1, sketch: 1, estimate: 1, coordinate: 1,
    support: 1, sell: 1, hire: 1, teach: 1, monitor: 1, deploy: 1, migrate: 1
  };
  function categoryVerb(category, functionName) {
    var head = str(category).split('&')[0];
    var words = head.replace(/[^A-Za-z\s]/g, ' ').split(/\s+/).filter(Boolean);
    var fn = str(functionName).toLowerCase();
    for (var i = 0; i < words.length && i < 3; i++) {
      var w = words[i].toLowerCase();
      if (w === fn && words.length > i + 1) continue;   // "Design critique" for Design → critique
      if (VERBS[w]) return w;
    }
    return null;
  }
  function statementFor(row) {
    var name = str(row.function);
    var mix = obj(row.assist_type_mix);
    var top = maxKey(mix);
    var lead = topCategoryFor(row);
    var verb = lead ? categoryVerb(lead, name) : null;

      h('p', { class: 'lede', text:
        (num(row && row.sessions) ? fmt(row.sessions) + ' sessions' : '') +
        (num(row && row.share) ? ', ' + pct(row.share) + ' of everything the team did' : '') +
        (splitTotal ? '. It shows up in ' + Object.keys(split).filter(function (k) { return num(split[k]) > 0; }).length + ' of ' + functionOrder.length + ' functions.' : '.')
      }),
      subs.length ? h('ul', { class: 'subcats' }, subs.map(function (x) {
        return h('li', {}, [document.createTextNode(str(x.name) + ' '), h('b', { text: fmt(x.sessions) })]);
      })) : null
    ]);

    var right = h('div', {});
    if (sum(mix, ['ask', 'make', 'do']) > 0) {
      right.appendChild(h('p', { class: 'block-head mono', text: 'Ask · make · do' }));
      right.appendChild(assistBar(mix, { height: 30, context: title }));
    }
    if (splitTotal > 0) {
      right.appendChild(h('p', { class: 'block-head mono', style: 'margin-top:26px', text: 'Who brings it' }));
      var bars = h('ul', { class: 'catlist' }, Object.keys(split)
        .filter(function (k) { return num(split[k]) > 0; })
        .sort(function (a, b) { return num(split[b]) - num(split[a]); })
        .map(function (k) {
          var v = num(split[k]);
          return h('li', { style: '--fc:' + fnColor(k) }, [
            h('div', { class: 'row' }, [
              h('span', { text: k }),
              h('span', { text: fmt(v) + ' · ' + pct(v / splitTotal) })
            ]),
            h('div', { class: 'track' }, [h('i', { style: 'width:' + Math.max(3, (v / splitTotal) * 100) + '%' })])
          ]);
        }));
      right.appendChild(bars);
    }

    section('spotlight', [
      h('div', { class: 'spotlight' }, [left, right])
    ]);
  })();

  /* ========================== patterns ========================== */
  (function patterns() {
    var ps = arr(narrative.patterns).filter(function (p) { return str(p); });
    var one = str(highlights.one_liner);
    if (!ps.length && !one) return;
    section('patterns', [
      label([h('b', { text: 'What the room noticed' })]),
      one ? h('blockquote', { class: 'oneliner serif', text: '“' + one + '”' }) : null,
      ps.length ? h('ul', { class: 'patterns' }, ps.map(function (p, i) {
        return h('li', {}, [
          h('span', { class: 'n mono', text: String(i + 1).padStart(2, '0') }),
          h('p', { text: p })
        ]);
      })) : null
    ]);
  })();

  /* ====================== by the numbers ======================== */
  (function numbers() {
    var stats = [];
    function push(v, k) { if (v !== null && v !== undefined && v !== '') stats.push({ v: v, k: k }); }

    if (num(totals.sessions)) push(fmt(totals.sessions), 'sessions');
    if (num(totals.messages)) push(fmt(totals.messages), 'messages');
    if (num(totals.sessions_per_person_per_week)) push(fmt(totals.sessions_per_person_per_week), 'sessions per person a week');
    var peopleCount = num(team.participants) || participants.length;
    if (peopleCount) push(fmt(peopleCount), plural(peopleCount, 'person', 'people') + ' took part');

    var topSource = maxBy(bySource, 'sessions');
    if (topSource) push(num(topSource.share) ? pct(topSource.share) : fmt(topSource.sessions), 'of sessions on ' + sourceLabel(topSource.source));

    var agentic = null;
    byMode.forEach(function (m) { if (str(m.mode) === 'agentic') agentic = m; });
    var modeTotal = byMode.reduce(function (a, m) { return a + num(m.sessions); }, 0);
    if (agentic && modeTotal) push(pct(num(agentic.sessions) / modeTotal), 'ran agentic');

    var topAssist = maxBy(byAssist, 'sessions');
    if (topAssist) push(num(topAssist.share) ? pct(topAssist.share) : fmt(topAssist.sessions), 'were ' + str(topAssist.label || topAssist.type).toLowerCase());

    var busiestDay = maxBy(byWeekday, 'sessions');
    if (busiestDay && str(busiestDay.label)) push(str(busiestDay.label), 'busiest weekday');

    var peakHour = maxBy(byHour, 'sessions');
    if (peakHour && num(peakHour.sessions)) push(hourLabel(peakHour.hour), 'peak hour');

    var bigWeek = maxBy(byWeek, 'sessions');
    if (bigWeek && num(bigWeek.sessions)) push(fmt(bigWeek.sessions), 'in the biggest week');

    var topTool = maxBy(tools, 'sessions');
    if (topTool && str(topTool.name)) push(str(topTool.name), 'most-reached-for tool');

    var topConn = maxBy(connectors, 'sessions');
    if (topConn && str(topConn.name)) push(str(topConn.name), 'most-connected app');

    if (str(highlights.most_agentic_function)) push(str(highlights.most_agentic_function), 'hands over the most');
    if (str(highlights.most_curious_function)) push(str(highlights.most_curious_function), 'asks the most');

    if (!stats.length) return;
    section('numbers', [
      h('h2', { class: 'sec', text: 'By the numbers' }),
      h('div', { class: 'band' }, stats.map(function (st) {
        return h('div', {}, [
          h('div', { class: 'v' + (/[A-Za-z]{6,}/.test(String(st.v)) ? ' long' : ''), text: st.v }),
          h('span', { class: 'k mono', text: st.k })
        ]);
      }))
    ]);
  })();

  /* ======================== table view ========================== */
  (function tables() {
    var blocks = [];
    function table(caption, cols, rows) {
      if (!rows.length) return null;
      return h('table', {}, [
        h('caption', { text: caption }),
        h('thead', {}, [h('tr', {}, cols.map(function (c, i) {
          return h('th', { class: i ? 'num' : '', text: c });
        }))]),
        h('tbody', {}, rows.map(function (r) {
          return h('tr', {}, r.map(function (cell, i) {
            return h('td', { class: i ? 'num' : '', text: cell });
          }));
        }))
      ]);
    }
    if (byFunction.length) {
      blocks.push(table('By function', ['Function', 'People', 'Sessions', 'Per person / week', 'Ask', 'Make', 'Do'],
        byFunction.map(function (f) {
          var m = obj(f.assist_type_mix);
          return [str(f.function), fmt(f.participants), fmt(f.sessions), fmt(f.sessions_per_person_per_week),
            fmt(m.ask), fmt(m.make), fmt(m.do)];
        })));
    }
    if (byCategory.length) {
      blocks.push(table('By category', ['Category', 'Sessions', 'Share'],
        byCategory.map(function (c) { return [str(c.category), fmt(c.sessions), pct(c.share)]; })));
    }
    if (participants.length) {
      blocks.push(table('Participants', ['Function', 'Sessions / week', 'Top category'],
        participants.slice().sort(function (a, b) { return num(b.sessions_per_week) - num(a.sessions_per_week); })
          .map(function (p) { return [str(p.function) || 'Unassigned', fmt(p.sessions_per_week), str(p.top_category)]; })));
    }
    if (bySource.length) {
      blocks.push(table('By source', ['Source', 'Sessions', 'Share'],
        bySource.map(function (x) { return [sourceLabel(x.source), fmt(x.sessions), pct(x.share)]; })));
    }
    blocks = blocks.filter(Boolean);
    if (!blocks.length) return;
    var det = h('details', { class: 'numbers' }, [
      h('summary', { class: 'mono', text: 'Show the numbers behind the pictures' }),
      h('div', { class: 'tables' }, blocks)
    ]);
    app.appendChild(det);
  })();

  /* =========================== footer =========================== */
  app.appendChild(h('footer', { class: 'mono' }, [
    h('span', { text: "Made with how-i-ai · anonymized team data · nobody's prompts were shared" }),
    str(DATA.generated_at) ? h('span', { text: fmtDate(DATA.generated_at) }) : null
  ]));

  if (!app.children.length) {
    app.appendChild(h('p', { class: 'empty', text: 'No aggregate data to show yet.' }));
  }
})();
</script>
</body>
</html>
