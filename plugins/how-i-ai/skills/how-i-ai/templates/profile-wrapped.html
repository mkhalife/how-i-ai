<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>how-i-ai — Wrapped</title>
<style>
/* ---------------------------------------------------------------- tokens */
:root{
  --gutter: 16px;
  --maxw: 980px;
  --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  --ui-ink: #fafaf7;
  --ui-bg: #0a0a0c;
}
*, *::before, *::after{ box-sizing: border-box; }
html{
  scroll-snap-type: y mandatory;
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
  background: var(--ui-bg);
}
body{
  margin: 0;
  background: var(--ui-bg);
  color: var(--ui-ink);
  font-family: var(--sans);
  font-synthesis-weight: auto;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  line-height: 1.45;
}
h1,h2,h3,p,ul,ol,figure,blockquote{ margin: 0; }
ul,ol{ padding: 0; list-style: none; }

/* ----------------------------------------------------------------- cards */
.card{
  position: relative;
  min-height: 100vh;
  min-height: 100svh;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: clamp(72px, 10vh, 104px) var(--gutter) clamp(72px, 10vh, 104px);
  background: var(--bg);
  color: var(--ink);
  overflow: hidden;
  isolation: isolate;
}
@media (min-width: 720px){ :root{ --gutter: 48px; } }
@media (min-width: 1100px){ :root{ --gutter: 72px; } }

.card::before{
  content: "";
  position: absolute; inset: -20% -10% auto -10%;
  height: 90%;
  background: radial-gradient(60% 70% at 70% 10%, color-mix(in srgb, var(--ink) 13%, transparent), transparent 70%);
  pointer-events: none; z-index: -1;
}
.card::after{
  content: "";
  position: absolute; inset: auto -20% -25% -20%;
  height: 70%;
  background: radial-gradient(50% 60% at 20% 90%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%);
  pointer-events: none; z-index: -1;
}
.wrap{ width: 100%; max-width: var(--maxw); margin: 0 auto; }

/* ------------------------------------------------------------- typography */
.eyebrow{
  font-size: clamp(11px, 1.5vw, 13px);
  font-weight: 700;
  letter-spacing: .18em;
  text-transform: uppercase;
  opacity: .72;
  margin-bottom: clamp(14px, 2.6vh, 26px);
}
.h1{
  font-size: clamp(38px, 9.5vw, 92px);
  font-weight: 800;
  line-height: 1.02;
  letter-spacing: -.035em;
  text-wrap: balance;
  overflow-wrap: break-word;
}
.h2{
  font-size: clamp(28px, 6.2vw, 58px);
  font-weight: 800;
  line-height: 1.06;
  letter-spacing: -.03em;
  text-wrap: balance;
  overflow-wrap: break-word;
}
.h3{
  font-size: clamp(19px, 3vw, 26px);
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: -.015em;
  overflow-wrap: break-word;
}
.lede{
  font-size: clamp(16px, 2.3vw, 21px);
  line-height: 1.5;
  opacity: .86;
  max-width: 46ch;
}
.small{ font-size: clamp(13px, 1.7vw, 15px); opacity: .74; line-height: 1.5; }
.mono-num{ font-variant-numeric: tabular-nums; }
.hero{
  font-size: clamp(92px, 27vw, 230px);
  font-weight: 800;
  line-height: .82;
  letter-spacing: -.055em;
  display: block;
}
.hero-sm{ font-size: clamp(56px, 15vw, 128px); font-weight: 800; line-height: .86; letter-spacing: -.05em; }
.accent{ color: var(--accent); }
.stack > * + *{ margin-top: clamp(14px, 2.4vh, 24px); }
.tight > * + *{ margin-top: 10px; }

/* ------------------------------------------------------------------ bits */
.chip{
  display: inline-flex; align-items: center; gap: 7px;
  padding: 6px 12px; border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--ink) 34%, transparent);
  font-size: clamp(12px, 1.6vw, 14px); font-weight: 600;
  line-height: 1.2;
}
.chip--solid{ background: color-mix(in srgb, var(--ink) 12%, transparent); border-color: transparent; }
.chips{ display: flex; flex-wrap: wrap; gap: 8px; }
.dot{ width: 10px; height: 10px; border-radius: 3px; background: currentColor; flex: none; }
.rule{ height: 1px; background: color-mix(in srgb, var(--ink) 22%, transparent); border: 0; }

.statgrid{ display: grid; gap: clamp(12px, 2vw, 20px); grid-template-columns: repeat(2, minmax(0,1fr)); }
@media (min-width: 720px){ .statgrid{ grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); } }
.statgrid--3{ grid-template-columns: repeat(2, minmax(0,1fr)); }
@media (min-width: 720px){ .statgrid--3{ grid-template-columns: repeat(3, minmax(0,1fr)); } }
.stat{
  padding: clamp(12px, 1.8vw, 18px) clamp(12px, 1.8vw, 18px);
  border-radius: 14px;
  background: color-mix(in srgb, var(--ink) 9%, transparent);
  min-width: 0;
}
.stat b{
  display: block;
  font-size: clamp(26px, 5vw, 40px);
  font-weight: 800; line-height: 1.05; letter-spacing: -.03em;
  overflow-wrap: break-word;
}
.stat span{ display: block; margin-top: 6px; font-size: clamp(11px, 1.5vw, 13px); opacity: .74;
  letter-spacing: .06em; text-transform: uppercase; font-weight: 600; }

.cols{ display: grid; gap: clamp(22px, 4vw, 44px); grid-template-columns: minmax(0,1fr); }
.panes{ display: grid; gap: clamp(12px, 1.8vw, 18px); grid-template-columns: minmax(0,1fr); }
@media (min-width: 760px){ .panes{ grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); } }
@media (min-width: 860px){ .cols--2{ grid-template-columns: minmax(0,1.35fr) minmax(0,1fr); align-items: start; } }
@media (min-width: 860px){ .cols--even{ grid-template-columns: repeat(2, minmax(0,1fr)); align-items: start; } }

.chart{ width: 100%; }
.chart svg{ display: block; width: 100%; height: auto; overflow: visible; }
.chart-title{ font-size: clamp(12px, 1.6vw, 13px); font-weight: 700; letter-spacing: .12em;
  text-transform: uppercase; opacity: .66; margin-bottom: 12px; }

.legend{ display: grid; gap: 2px; margin-top: 18px; }
.legend li{
  display: grid; grid-template-columns: 16px minmax(0,1fr) auto auto;
  gap: 10px; align-items: baseline; padding: 9px 0;
  border-top: 1px solid color-mix(in srgb, var(--ink) 16%, transparent);
  font-size: clamp(14px, 1.9vw, 16px);
}
.legend li .sw{ width: 12px; height: 12px; border-radius: 4px; background: var(--ink); align-self: center; }
.legend li .nm{ font-weight: 650; overflow-wrap: break-word; min-width: 0; }
.legend li .v{ font-variant-numeric: tabular-nums; opacity: .8; }
.legend li .p{ font-variant-numeric: tabular-nums; font-weight: 700; min-width: 3.5em; text-align: right; }

.rows{ display: grid; gap: 2px; }
.row{
  display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 12px; align-items: baseline;
  padding: 10px 0; border-top: 1px solid color-mix(in srgb, var(--ink) 16%, transparent);
}
.row .nm{ font-weight: 600; overflow-wrap: break-word; }
.row .v{ font-variant-numeric: tabular-nums; opacity: .78; font-size: .9em; white-space: nowrap; }

.moment{
  display: grid; gap: 4px;
  padding: clamp(11px, 1.7vh, 15px) 0;
  border-top: 1px solid color-mix(in srgb, var(--ink) 18%, transparent);
}
.moment .q{ font-size: clamp(16px, 2.5vw, 22px); font-weight: 650; line-height: 1.28;
  letter-spacing: -.01em; overflow-wrap: break-word; }
.moment .m{ font-size: clamp(11.5px, 1.5vw, 13px); opacity: .7; letter-spacing: .04em; }

.panel{
  border-radius: 20px;
  padding: clamp(18px, 3vw, 28px);
  background: color-mix(in srgb, var(--ink) 10%, transparent);
}
.quote{
  font-size: clamp(26px, 5.6vw, 54px); font-weight: 800; line-height: 1.08;
  letter-spacing: -.03em; text-wrap: balance; overflow-wrap: break-word;
}
.patterns{ counter-reset: p; display: grid; gap: clamp(10px, 1.8vh, 16px); }
.patterns li{
  counter-increment: p; position: relative; padding-left: 44px;
  font-size: clamp(15px, 2.1vw, 19px); line-height: 1.4; overflow-wrap: break-word;
}
.patterns li::before{
  content: counter(p, decimal-leading-zero);
  position: absolute; left: 0; top: .05em;
  font-size: clamp(12px, 1.6vw, 14px); font-weight: 800; letter-spacing: .04em;
  opacity: .6; font-variant-numeric: tabular-nums;
}

/* --------------------------------------------------------------- share card */
.share{
  border-radius: 24px;
  border: 1px solid color-mix(in srgb, var(--ink) 26%, transparent);
  background:
    radial-gradient(90% 120% at 100% 0%, color-mix(in srgb, var(--accent) 20%, transparent), transparent 60%),
    radial-gradient(80% 100% at 0% 100%, color-mix(in srgb, var(--pop) 26%, transparent), transparent 62%),
    color-mix(in srgb, var(--ink) 6%, transparent);
  padding: clamp(22px, 4.2vw, 40px);
  display: grid; gap: clamp(18px, 3vh, 28px);
}
.share-head{ display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.share-grid{ display: grid; gap: clamp(16px, 3vw, 26px); grid-template-columns: minmax(0,1fr); }
@media (min-width: 720px){ .share-grid{ grid-template-columns: minmax(0,1.15fr) minmax(0,1fr); } }
.share-foot{
  display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap;
  font-size: clamp(11.5px, 1.5vw, 13px); opacity: .7; letter-spacing: .04em;
}
.mini{ display: grid; gap: 8px; }
.mini li{ display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 10px; align-items: baseline; }
.mini .nm{ font-weight: 650; font-size: clamp(14px, 1.9vw, 17px); overflow-wrap: break-word; }
.mini .v{ font-variant-numeric: tabular-nums; opacity: .8; font-size: clamp(13px, 1.7vw, 15px); }
.mini .track{ grid-column: 1 / -1; height: 6px; border-radius: 999px;
  background: color-mix(in srgb, var(--ink) 18%, transparent); overflow: hidden; }
.mini .fill{ display: block; height: 100%; border-radius: 999px; background: var(--ink); }

/* ------------------------------------------------------------------- chrome */
#progress{
  position: fixed; top: 0; left: 0; height: 3px; width: 100%;
  z-index: 40; pointer-events: none;
  background: color-mix(in srgb, var(--ui-ink) 18%, transparent);
}
#progress i{ display: block; height: 100%; width: 0; background: var(--ui-ink); transition: width .35s ease, background .5s ease; }
#rail{
  position: fixed; right: 18px; top: 50%; transform: translateY(-50%);
  display: grid; gap: 10px; z-index: 40;
}
#rail button{
  width: 8px; height: 8px; padding: 0; border: 0; border-radius: 999px; cursor: pointer;
  background: var(--ui-ink); opacity: .3; transition: opacity .35s ease, height .35s ease, background .5s ease;
}
#rail button[aria-current="true"]{ opacity: 1; height: 20px; }
#counter{
  position: fixed; left: var(--gutter); bottom: 18px; z-index: 40;
  font-size: 12px; font-weight: 700; letter-spacing: .16em;
  color: var(--ui-ink); opacity: .6; font-variant-numeric: tabular-nums;
  transition: color .5s ease; pointer-events: none;
}
@media (max-width: 640px){ #rail{ display: none; } }
.scrollcue{
  position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%);
  font-size: 11px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase;
  opacity: .55; display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.scrollcue i{ display: block; width: 1px; height: 26px; background: currentColor; animation: cue 1.8s ease-in-out infinite; }
@keyframes cue{ 0%,100%{ transform: scaleY(.35); opacity: .4; } 50%{ transform: scaleY(1); opacity: 1; } }

/* --------------------------------------------------------------- animation */
[data-anim]{ opacity: 0; transform: translateY(20px); }
.is-in [data-anim]{
  opacity: 1; transform: none;
  transition: opacity .7s cubic-bezier(.2,.7,.25,1), transform .7s cubic-bezier(.2,.7,.25,1);
  transition-delay: var(--d, 0ms);
}
.grow{ transform-origin: var(--o, 50% 100%); transform: scaleY(0); }
.is-in .grow{ transform: none; transition: transform .8s cubic-bezier(.2,.75,.25,1); transition-delay: var(--d, 0ms); }
.grow-x{ transform-box: fill-box; transform-origin: 0 50%; transform: scaleX(0); }
.is-in .grow-x{ transform: none; transition: transform .8s cubic-bezier(.2,.75,.25,1); transition-delay: var(--d, 0ms); }

@media (prefers-reduced-motion: reduce){
  html{ scroll-behavior: auto; }
  [data-anim], .grow, .grow-x{ opacity: 1 !important; transform: none !important; transition: none !important; }
  .scrollcue i{ animation: none; }
  #progress i, #rail button{ transition: none; }
}
@media print{
  html{ scroll-snap-type: none; }
  .card{ min-height: auto; page-break-after: always; }
  #rail, #progress, #counter, .scrollcue{ display: none; }
}
</style>
</head>

<script>
(function () {
  "use strict";

  function pct(share, total, part) {

    for (var i = 1; i < arguments.length; i++) if (arguments[i]) parent.appendChild(arguments[i]);

           "L" + x + "," + (y + r) +
           "Q" + x + "," + y + " " + (x + r) + "," + y +
           "L" + (x + w - r) + "," + y +
           "Q" + (x + w) + "," + y + " " + (x + w) + "," + (y + r) +
           "L" + (x + w) + "," + (y + h) + "Z";
  }
  function endRoundedPath(x, y, w, h, r) {
    r = Math.max(0, Math.min(r, w, h / 2));

           "L" + (x + w - r) + "," + y +
           "Q" + (x + w) + "," + y + " " + (x + w) + "," + (y + r) +
           "L" + (x + w) + "," + (y + h - r) +
           "Q" + (x + w) + "," + (y + h) + " " + (x + w - r) + "," + (y + h) +

  function txt(parent, x, y, text, opt) {
    opt = opt || {};
    var t = s("text", {
      x: x, y: y,
      "text-anchor": opt.anchor || "middle",
      "font-size": opt.size || 12,

      fill: "currentColor",

  /*  100% stacked horizontal bar: ordered parts of a whole, 2px surface gaps. */
  function stackedBar(parts, opt) {
    opt = opt || {};
    return chart(function (svgEl, w) {
      var total = 0, i;
      for (i = 0; i < parts.length; i++) total += n(parts[i].value);
      if (total <= 0) return 0;
      var h = opt.height || (w < 520 ? 48 : 62);
      var gap = 2, r = 8;
      var id = "clip" + Math.random().toString(36).slice(2, 9);
      var defs = s("defs");
      var cp = s("clipPath", { id: id });
      cp.appendChild(s("rect", { x: 0, y: 0, width: w, height: h, rx: r, ry: r }));
      defs.appendChild(cp);
      svgEl.appendChild(defs);
      var g = s("g", { "clip-path": "url(#" + id + ")" });
      svgEl.appendChild(g);
      var x = 0;
      for (i = 0; i < parts.length; i++) {
        var seg = (n(parts[i].value) / total) * w;
        var wid = Math.max(0, seg - (i < parts.length - 1 ? gap : 0));
        if (wid > 0) {
          g.appendChild(s("rect", {
            x: x, y: 0, width: wid, height: h,
            fill: parts[i].color || "currentColor",
            "fill-opacity": parts[i].opacity == null ? 1 : parts[i].opacity
          }));
        }
        x += seg;
      }
      return h;
    });
  }

  /*  Ranked horizontal bars, magnitude by length, value at the tip. */
  function rankedBars(items, opt) {
    opt = opt || {};
    return chart(function (svgEl, w) {
      if (!items.length) return 0;
      var compact = w < 620;
      var labelSize = compact ? 14 : 16;
      var rowH = compact ? 52 : 60;
      var barH = compact ? 12 : 14;
      var max = 0, i;
      for (i = 0; i < items.length; i++) max = Math.max(max, n(items[i].value));
      var valSize = compact ? 12 : 13;
      var valGutter = 0;
      for (i = 0; i < items.length; i++) valGutter = Math.max(valGutter, textW(items[i].valueLabel || "", valSize, 700));
      valGutter = Math.ceil(valGutter) + 12;
      var trackW = Math.max(40, w - valGutter);
      var h = rowH * items.length;

      for (i = 0; i < items.length; i++) {
        var top = rowH * i;
        var v = n(items[i].value);
        var bw = max > 0 ? Math.max(4, (v / max) * trackW) : 4;
        var hot = !!items[i].hot;
        var label = txt(svgEl, 0, top + labelSize + 2, items[i].label, {
          anchor: "start", size: labelSize, weight: hot ? 800 : 650, op: hot ? 1 : .88
        });

        fitText(label, w - 2, 12);
        var by = top + labelSize + 14;
        var g = s("g", { class: "grow-x" });
        g.appendChild(s("path", {
          d: endRoundedPath(0, by, bw, barH, 4),
          fill: hot ? "var(--accent)" : "currentColor",

              { anchor: "start", size: valSize, weight: 700, op: hot ? .95 : .7 });

      return h;
    });

      var val = el("div", "mono-num");
      val.style.fontWeight = "800";
      val.style.fontSize = "clamp(26px,4.6vw,40px)";
      val.style.letterSpacing = "-.03em";
      val.textContent = pct(x.share, total, x.sessions) || fmt(n(x.sessions));
      add(head, nmWrap, val);
      var body = el("p", "small", COPY[key] || "");
      body.style.marginTop = "10px";
      body.style.opacity = ".82";
      var count = el("p", "small", fmt(n(x.sessions)) + " " + plural(n(x.sessions), "session", "sessions"));
      count.style.marginTop = "6px";
      count.style.opacity = ".62";
      add(pane, head, body, count);
      add(list, anim(pane));
    }
    add(b, list);
    stagger(b, 80);
  })();

  /* =======================================  8. tools & connectors ===== */
  if (TOOLS.length || CONNECTORS.length) (function () {
    var c = card("tools", "green", "Tools & connectors");
    var b = c.body;
    add(b, eyebrow("what it touched"));
    var h = el("h2", "h2");
    var topTool = TOOLS.length ? str(TOOLS[0].name) : "";
    var topConn = CONNECTORS.length ? str(CONNECTORS[0].name) : "";
    h.textContent = topTool ? "It reached for " + topTool + " most."
                  : "It worked through " + topConn + ".";
    add(b, anim(h));
    var lede = el("p", "lede");
    lede.textContent = [
      TOOLS.length ? fmt(TOOLS.length) + " built-in " + plural(TOOLS.length, "tool", "tools") : "",
      CONNECTORS.length ? fmt(CONNECTORS.length) + " connected " + plural(CONNECTORS.length, "service", "services") : ""
    ].filter(Boolean).join(" · ") + " showed up in your sessions.";
    add(b, anim(lede));

    var grid = el("div", "cols cols--even");
    function listBlock(title, items, cap) {
      var wrapEl = el("div");
      add(wrapEl, el("div", "chart-title", title));
      var max = 0, i;
      for (i = 0; i < items.length; i++) max = Math.max(max, n(items[i].sessions));
      var ul = el("div", "rows");
      for (i = 0; i < Math.min(items.length, cap); i++) {
        var r = el("div", "row");
        var left = el("div");
        left.style.minWidth = "0";
        var nm = el("div", "nm", str(items[i].name) || "—");
        var track = el("div");
        track.style.height = "6px";
        track.style.marginTop = "7px";
        track.style.borderRadius = "999px";
        track.style.background = "color-mix(in srgb, var(--ink) 16%, transparent)";
        track.style.overflow = "hidden";
        var fill = el("div", "grow-x");
        fill.style.height = "100%";
        fill.style.borderRadius = "999px";
        fill.style.background = i === 0 ? "var(--accent)" : "currentColor";
        fill.style.opacity = i === 0 ? "1" : ".45";
        fill.style.width = (max > 0 ? Math.max(4, (n(items[i].sessions) / max) * 100) : 4) + "%";
        track.appendChild(fill);
        add(left, nm, track);
        var v = el("div", "v", fmt(n(items[i].sessions)));
        add(r, left, v);
        ul.appendChild(r);
      }
      add(wrapEl, ul);
      if (items.length > cap) {
        var more = el("p", "small", "+ " + (items.length - cap) + " more");
        more.style.marginTop = "10px";
        add(wrapEl, more);
      }
      return anim(wrapEl);
    }
    if (TOOLS.length) add(grid, listBlock("built-in tools", TOOLS, 7));
    if (CONNECTORS.length) add(grid, listBlock("connectors", CONNECTORS, 7));
    add(b, grid);
    stagger(b, 70);
  })();

  /* ========================================  8b. skills & agents ===== */
  if (SKILLS.length || AGENTS.length) (function () {
    var c = card("skills_agents", "teal", "Your skills");
    var b = c.body;
    var i;
    var skillsRanked = SKILLS.slice().sort(function (a, z) { return n(z.sessions) - n(a.sessions); });
    var agentsRanked = AGENTS.slice().sort(function (a, z) { return n(z.sessions) - n(a.sessions); });
    var skillsShown = skillsRanked.slice(0, 6);
    var agentsShown = agentsRanked.slice(0, 6);
    var skillsTotal = 0, agentsTotal = 0;
    for (i = 0; i < SKILLS.length; i++) skillsTotal += n(SKILLS[i].sessions);
    for (i = 0; i < AGENTS.length; i++) agentsTotal += n(AGENTS[i].sessions);

    add(b, eyebrow("what you reached for"));
    var h = el("h2", "h2");
    h.textContent = skillsShown.length
      ? "Your go-to skill: " + str(skillsShown[0].name) + "."
      : "Your go-to agent: " + str(agentsShown[0].name) + ".";
    add(b, anim(h));
    var ledeParts = [];
    if (SKILLS.length) ledeParts.push(fmt(skillsTotal) + " skill " + plural(skillsTotal, "invocation", "invocations") +
      " across " + fmt(SKILLS.length) + " " + plural(SKILLS.length, "skill", "skills"));
    if (AGENTS.length) ledeParts.push(fmt(agentsTotal) + " sub-agent " + plural(agentsTotal, "spawn", "spawns") +
      " across " + fmt(AGENTS.length) + " agent " + plural(AGENTS.length, "type", "types"));
    var lede = el("p", "lede", ledeParts.join(" · ") + ".");
    add(b, anim(lede));

    var grid = el("div", "cols cols--even");
    if (skillsShown.length) {
      var skillsWrap = el("div");
      add(skillsWrap, el("div", "chart-title", "top skills"));
      add(skillsWrap, rankedBars(skillsShown.map(function (x, idx) {
        return {
          label: str(x.name) || "—",
          value: n(x.sessions),
          valueLabel: fmt(n(x.sessions)) + " " + plural(n(x.sessions), "session", "sessions"),
          hot: idx === 0
        };
      }), {}));
      if (skillsRanked.length > skillsShown.length) {
        var moreS = el("p", "small", "+ " + (skillsRanked.length - skillsShown.length) + " more");
        moreS.style.marginTop = "10px";
        add(skillsWrap, moreS);
      }
      add(grid, anim(skillsWrap));
    }
    if (agentsShown.length) {
      var agentsWrap = el("div");
      add(agentsWrap, el("div", "chart-title", "top agents"));
      var max = 0;
      for (i = 0; i < agentsShown.length; i++) max = Math.max(max, n(agentsShown[i].sessions));
      var ul = el("div", "rows");
      for (i = 0; i < agentsShown.length; i++) {
        var x = agentsShown[i];
        var r = el("div", "row");
        var left = el("div");
        left.style.minWidth = "0";
        var nmRow = el("div");
        nmRow.style.display = "flex";
        nmRow.style.alignItems = "center";
        nmRow.style.flexWrap = "wrap";
        nmRow.style.gap = "7px";
        add(nmRow, el("span", "nm", str(x.name) || "—"));
        if (x.custom) {
          var chip = el("span", "chip", "custom");
          chip.style.padding = "2px 8px";
          chip.style.fontSize = "10.5px";
          chip.style.fontWeight = "700";
          chip.style.letterSpacing = ".04em";
          chip.style.textTransform = "uppercase";
          nmRow.appendChild(chip);
        }
        var track = el("div");
        track.style.height = "6px";
        track.style.marginTop = "7px";
        track.style.borderRadius = "999px";
        track.style.background = "color-mix(in srgb, var(--ink) 16%, transparent)";
        track.style.overflow = "hidden";
        var fill = el("div", "grow-x");
        fill.style.height = "100%";
        fill.style.borderRadius = "999px";
        fill.style.background = i === 0 ? "var(--accent)" : "currentColor";
        fill.style.opacity = i === 0 ? "1" : ".45";
        fill.style.width = (max > 0 ? Math.max(4, (n(x.sessions) / max) * 100) : 4) + "%";
        track.appendChild(fill);
        add(left, nmRow, track);
        var v = el("div", "v", fmt(n(x.sessions)));
        add(r, left, v);
        ul.appendChild(r);
      }
      add(agentsWrap, ul);
      if (agentsRanked.length > agentsShown.length) {
        var moreA = el("p", "small", "+ " + (agentsRanked.length - agentsShown.length) + " more");
        moreA.style.marginTop = "10px";
        add(agentsWrap, moreA);
      }
      add(grid, anim(agentsWrap));
    }
    add(b, grid);
    stagger(b, 70);
  })();

  /* ==================================================  9. surprise ===== */
  (function () {
    var sp = obj(HI.surprise);
    var lead = str(sp.paraphrase) ? sp : (SURPRISES.length ? SURPRISES[0] : null);
    if (!lead || !str(lead.paraphrase)) return;
    var c = card("surprise", "pink", "The surprise");
    var b = c.body;
    add(b, eyebrow("and then there was this"));
    var kicker = el("p", "h3", "One session did not fit the pattern.");
    kicker.style.opacity = ".78";
    add(b, anim(kicker));
    var q = el("blockquote", "quote");
    q.textContent = "“" + str(lead.paraphrase) + "”";
    add(b, anim(q));
    var meta = el("div", "chips");
    if (str(lead.category)) add(meta, anim(el("span", "chip chip--solid", str(lead.category))));
    if (str(lead.source)) add(meta, anim(el("span", "chip", titleCase(str(lead.source).replace(/[-_]/g, " ")))));
    if (str(lead.date)) add(meta, anim(el("span", "chip", shortDate(lead.date))));
    if (meta.children.length) add(b, meta);
    if (str(sp.why)) {
      var why = el("p", "lede", str(sp.why) + ".");
      why.textContent = str(sp.why).replace(/\.$/, "") + ".";
      add(b, anim(why));
    }
    var rest = SURPRISES.filter(function (x) { return str(x.paraphrase) !== str(lead.paraphrase); }).slice(0, 3);
    if (rest.length) {
      var wrapEl = el("div");
      add(wrapEl, el("div", "chart-title", "other things that stood out"));
      var ul = el("div", "rows");
      for (var i = 0; i < rest.length; i++) {
        var r = el("div", "row");
        add(r, el("div", "nm", str(rest[i].paraphrase)),
               el("div", "v", [str(rest[i].category), str(rest[i].date) ? shortDate(rest[i].date) : ""].filter(Boolean).join(" · ")));
        ul.appendChild(r);
      }
      add(wrapEl, ul);
      add(b, anim(wrapEl));
    }
    stagger(b, 90);
  })();

  /* ==================================================  10. moments ===== */
  if (SAMPLES.length) (function () {
    var c = card("moments", "midnight", "Moments");
    var b = c.body;
    add(b, eyebrow("a few moments"));
    var h = el("h2", "h2", "Things you actually asked for.");
    add(b, anim(h));
    var lede = el("p", "lede", "Paraphrased on your machine. Nothing here left it.");
    add(b, anim(lede));
    var list = el("div");
    var shown = SAMPLES.slice(0, 7);
    for (var i = 0; i < shown.length; i++) {
      var x = shown[i];
      var m = el("div", "moment");
      var q = el("div", "q", "“" + str(x.paraphrase) + "”");
      var bits = [];
      if (str(x.date)) bits.push(shortDate(x.date));
      if (str(x.category)) bits.push(str(x.category));
      if (str(x.assist_type)) bits.push(str(x.assist_type).toUpperCase());
      if (str(x.source)) bits.push(titleCase(str(x.source).replace(/[-_]/g, " ")));
      if (isNum(x.messages)) bits.push(fmt(x.messages) + " msgs");
      add(m, q, el("div", "m", bits.join("  ·  ")));
      add(list, anim(m));
    }
    add(b, list);
    if (SAMPLES.length > shown.length) {
      add(b, anim(el("p", "small", shown.length + " of " + SAMPLES.length + " sampled sessions.")));
    }
    stagger(b, 60);
  })();

  /* =================================================  11. narrative ===== */
  if (str(NARR.headline) || str(NARR.summary) || arr(NARR.patterns).length || str(HI.signature_move)) (function () {
    var c = card("narrative", "forest", "The read");
    var b = c.body;
    add(b, eyebrow("the read on you"));
    if (str(NARR.headline)) add(b, anim(el("h2", "h2", str(NARR.headline))));
    if (str(NARR.summary)) {
      var p = el("p", "lede", str(NARR.summary));
      p.style.maxWidth = "62ch";
      add(b, anim(p));
    }
    var pats = arr(NARR.patterns).filter(function (x) { return str(x); });
    if (pats.length) {
      var ol = el("ol", "patterns");
      for (var i = 0; i < pats.length; i++) add(ol, anim(el("li", "", str(pats[i]))));
      add(b, ol);
    }
    if (str(HI.signature_move)) {
      var pane = el("div", "panel");
      add(pane, el("div", "chart-title", "your signature move"));
      var sm = el("p", "h3", str(HI.signature_move));
      add(pane, sm);
      add(b, anim(pane));
    }
    stagger(b, 70);
  })();

  /* ====================================================  12. share ===== */
  (function () {
    var c = card("share", "finale", "Share");
    var b = c.body;
    var i;
    var catTotal = 0;
    for (i = 0; i < CATS.length; i++) catTotal += n(CATS[i].sessions);
    var top3 = CATS.slice().sort(function (a, z) { return n(z.sessions) - n(a.sessions); }).slice(0, 3);
    var assistTotal = 0;
    for (i = 0; i < ASSIST.length; i++) assistTotal += n(ASSIST[i].sessions);
    var assistOrder = ASSIST.slice().sort(function (a, z) {
      var o = { ask: 0, make: 1, do: 2 };
      var ka = o[str(a.type)], kz = o[str(z.type)];
      return (ka == null ? 9 : ka) - (kz == null ? 9 : kz);
    });

    add(b, eyebrow("the one to screenshot"));
    var poster = el("div", "share");
    var head = el("div", "share-head");
    add(head, el("div", "chart-title", "my ai, " + (daysLabel || "30 days")));
    add(head, el("div", "chart-title", str(PERSON.function) || str(PERSON.title) || "how-i-ai"));
    add(poster, head);

    var line = el("p", "quote");
    line.textContent = str(HI.one_liner) || str(NARR.headline) || "A month of working with AI.";
    add(poster, line);

    var grid = el("div", "share-grid");

    var left = el("div");
    add(left, el("div", "chart-title",
      top3.length ? ("top " + (top3.length === 1 ? "category" : top3.length + " categories")) : "top categories"));
    if (top3.length) {
      var ul = el("ul", "mini");
      for (i = 0; i < top3.length; i++) {
        var li = el("li");
        var share = isNum(top3[i].share) ? top3[i].share : (catTotal > 0 ? n(top3[i].sessions) / catTotal : 0);
        add(li, el("span", "nm", (i + 1) + ". " + (str(top3[i].category) || "—")),
                el("span", "v", pct(top3[i].share, catTotal, top3[i].sessions) || fmt(n(top3[i].sessions))));
        var track = el("span", "track");
        var fill = el("i", "fill");
        fill.style.width = Math.max(4, Math.round(share * 100)) + "%";
        fill.style.opacity = i === 0 ? "1" : (i === 1 ? ".7" : ".48");
        track.appendChild(fill);
        li.appendChild(track);
        add(ul, li);
      }
      add(left, ul);
    } else {
      add(left, el("p", "small", "No categories in this window."));
    }

    var right = el("div");
    var tiles = el("div", "statgrid statgrid--3");
    tiles.style.gridTemplateColumns = "repeat(2, minmax(0,1fr))";
    if (isNum(T.sessions_per_week)) add(tiles, statTile(fmt(T.sessions_per_week), "sessions / week"));
    if (isNum(T.sessions)) add(tiles, statTile(fmt(T.sessions), "sessions"));
    if (tiles.children.length) add(right, tiles);
    if (assistOrder.length) {
      var ab = el("div");
      ab.style.marginTop = "clamp(14px,2.4vh,20px)";
      add(ab, el("div", "chart-title", "ask · make · do"));
      add(ab, stackedBar(assistOrder.map(function (x, idx) {
        return { value: n(x.sessions), opacity: stepOf(idx) };
      }), { height: 26 }));
      var row = el("div");
      row.style.display = "flex";
      row.style.flexWrap = "wrap";
      row.style.gap = "10px 18px";
      row.style.marginTop = "12px";
      for (i = 0; i < assistOrder.length; i++) {
        var item = el("div");
        item.style.display = "flex";
        item.style.alignItems = "center";
        item.style.gap = "8px";
        item.style.fontSize = "clamp(13px,1.7vw,15px)";
        var sw = el("span", "dot");
        sw.style.opacity = stepOf(i);
        var lbl = el("span", "", (str({ ask: "Asked", make: "Made", do: "Did" }[str(assistOrder[i].type)]) ||
          str(assistOrder[i].label) || titleCase(str(assistOrder[i].type))) + " " +
          (pct(assistOrder[i].share, assistTotal, assistOrder[i].sessions) || fmt(n(assistOrder[i].sessions))));
        lbl.style.fontWeight = "650";
        add(item, sw, lbl);
        add(row, item);
      }
      add(ab, row);
      add(right, ab);
    }

    add(grid, left, right);
    add(poster, grid);

    var foot = el("div", "share-foot");
    add(foot, el("span", "", windowLabel || daysLabel));
    add(foot, el("span", "", "Made with how-i-ai · data stays on your machine"));
    add(poster, el("hr", "rule"), foot);

    add(b, anim(poster));
    stagger(b, 90);
  })();

  /* ------------------------------------------------------------- mount */
  var app = document.getElementById("app");
  for (var ci = 0; ci < cards.length; ci++) app.appendChild(cards[ci]);

  /* rail + counter */
  var rail = document.getElementById("rail");
  var counter = document.getElementById("counter");
  var bar = document.querySelector("#progress i");
  var buttons = [];
  cards.forEach(function (sec, idx) {
    var btn = document.createElement("button");
    btn.type = "button";
    btn.title = sec.dataset.label || ("Card " + (idx + 1));
    btn.setAttribute("aria-label", btn.title);
    btn.addEventListener("click", function () {
      sec.scrollIntoView({ behavior: REDUCED ? "auto" : "smooth", block: "start" });
    });
    rail.appendChild(btn);
    buttons.push(btn);
  });
  function pad2(v) { return v < 10 ? "0" + v : "" + v; }
  function setActive(idx) {
    for (var i = 0; i < buttons.length; i++) buttons[i].setAttribute("aria-current", i === idx ? "true" : "false");
    counter.textContent = pad2(idx + 1) + " / " + pad2(cards.length);
    var ink = cards[idx].dataset.ink || "#fff";
    document.documentElement.style.setProperty("--ui-ink", ink);
    document.documentElement.style.setProperty("--ui-bg", cards[idx].style.getPropertyValue("--bg"));
    bar.style.width = (((idx + 1) / cards.length) * 100) + "%";
  }
  setActive(0);

  /* entrance + active tracking */
  if ("IntersectionObserver" in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) {
          en.target.classList.add("is-in");
          runCounts(en.target);
        }
      });
    }, { threshold: 0.18 });
    var active = new IntersectionObserver(function (entries) {
      var best = null;
      entries.forEach(function (en) {
        if (en.isIntersecting && (!best || en.intersectionRatio > best.intersectionRatio)) best = en;
      });
      if (best) setActive(cards.indexOf(best.target));
    }, { threshold: [0.5, 0.75] });
    cards.forEach(function (sec) { io.observe(sec); active.observe(sec); });
  } else {
    cards.forEach(function (sec) { sec.classList.add("is-in"); runCounts(sec); });
  }

  function runCounts(root) {
    var nodes = root.querySelectorAll("[data-count]");
    for (var i = 0; i < nodes.length; i++) {
      (function (node) {
        if (node.dataset.counted) return;
        node.dataset.counted = "1";
        var target = parseFloat(node.getAttribute("data-count"));
        if (!isFinite(target)) return;
        if (REDUCED) { node.textContent = fmt(target); return; }
        var start = null, dur = 1100;
        function step(ts) {
          if (start === null) start = ts;
          var t = Math.min(1, (ts - start) / dur);
          var e = 1 - Math.pow(1 - t, 3);
          node.textContent = fmt(Math.round(target * e));
          if (t < 1) requestAnimationFrame(step);
          else node.textContent = fmt(target);
        }
        node.textContent = fmt(0);
        requestAnimationFrame(step);
      })(nodes[i]);
    }
  }

  /* draw + keep charts crisp on resize */
  redrawAll();
  var rt;
  window.addEventListener("resize", function () {
    clearTimeout(rt);
    rt = setTimeout(redrawAll, 140);
  });

  /* keyboard paging */
  document.addEventListener("keydown", function (e) {
    if (e.key !== "ArrowDown" && e.key !== "ArrowUp" && e.key !== "PageDown" && e.key !== "PageUp") return;
    if (e.target && /^(input|textarea|select)$/i.test(e.target.tagName)) return;
    var cur = 0, bestTop = Infinity;
    for (var i = 0; i < cards.length; i++) {
      var d = Math.abs(cards[i].getBoundingClientRect().top);
      if (d < bestTop) { bestTop = d; cur = i; }
    }
    var next = (e.key === "ArrowDown" || e.key === "PageDown") ? cur + 1 : cur - 1;
    if (next >= 0 && next < cards.length) {
      e.preventDefault();
      cards[next].scrollIntoView({ behavior: REDUCED ? "auto" : "smooth", block: "start" });
    }
  });
})();
</script>
</body>
