/* ---------- base ---------- */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--plane);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 64px}
@media (min-width:900px){ .wrap{padding:0 32px 88px} }

h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.015em}
p{margin:0}
a{color:inherit}
svg{display:block;overflow:visible}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
header.top{padding:40px 0 0}
@media (min-width:900px){ header.top{padding:56px 0 0} }
.eyebrow{
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);font-weight:600;
}
.top-row{display:flex;gap:16px;align-items:flex-start;justify-content:space-between}
h1{font-size:clamp(26px,4.6vw,40px);line-height:1.12;margin-top:10px;max-width:24ch}
.sub{margin-top:12px;color:var(--ink-2);font-size:15px;max-width:60ch}
.meta{margin-top:18px;display:flex;flex-wrap:wrap;gap:8px}
.chip{
  display:inline-flex;align-items:center;gap:7px;
  border:1px solid var(--hairline);border-radius:999px;
  padding:5px 11px;font-size:12.5px;color:var(--ink-2);background:var(--surface);
}
.chip .dot{width:8px;height:8px;border-radius:50%;flex:none}
.theme-btn{
  flex:none;border:1px solid var(--hairline);background:var(--surface);
  color:var(--ink-2);border-radius:999px;padding:7px 13px;font:inherit;font-size:12.5px;
  cursor:pointer;white-space:nowrap;
}
.theme-btn:hover{color:var(--ink);border-color:var(--axis)}

/* ---------- privacy band ---------- */
.privacy{
  margin-top:26px;background:var(--surface);border:1px solid var(--hairline-2);
  border-radius:var(--radius);padding:16px 18px;display:flex;gap:14px;align-items:flex-start;
}
.privacy .lock{
  flex:none;width:26px;height:26px;border-radius:8px;background:var(--surface-2);
  display:grid;place-items:center;color:var(--ink-2);
}
.privacy h4{font-size:13px;margin-bottom:4px}
.privacy p{font-size:12.5px;color:var(--ink-2);line-height:1.55}
.privacy code{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;
  background:var(--surface-2);padding:1px 5px;border-radius:5px;color:var(--ink-2);
}

/* ---------- sections ---------- */
section{margin-top:52px}
@media (min-width:900px){ section{margin-top:72px} }
.sec-head{margin-bottom:20px;max-width:70ch}
.sec-head .eyebrow{margin-bottom:8px}
.sec-head h2{font-size:clamp(19px,2.4vw,24px)}
.sec-head p{margin-top:8px;color:var(--ink-2);font-size:14px}

.card{
  background:var(--surface);border:1px solid var(--hairline-2);
  border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);
}
@media (min-width:900px){ .card{padding:24px} }
.card h3{font-size:15px}
.card .card-sub{margin-top:4px;color:var(--muted);font-size:12.5px}
.card-head{display:flex;gap:12px;align-items:baseline;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}

.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr;align-items:start}
@media (min-width:860px){ .g2{grid-template-columns:1fr 1fr} }
.g-auto{grid-template-columns:repeat(auto-fit,minmax(260px,1fr));align-items:start}

/* ---------- answer cards ---------- */
.answers{display:grid;gap:16px;grid-template-columns:1fr;margin-top:28px}
@media (min-width:860px){ .answers{grid-template-columns:1.15fr 1fr} }
.answer{position:relative;overflow:hidden}
.answer .eyebrow{color:var(--muted)}
.hero-num{
  font-size:clamp(44px,7vw,64px);line-height:1;font-weight:600;letter-spacing:-.03em;
  margin-top:14px;
}
.answer .big-label{font-size:clamp(20px,2.6vw,26px);font-weight:600;line-height:1.2;margin-top:10px;letter-spacing:-.02em}
.answer .note{margin-top:12px;color:var(--ink-2);font-size:13.5px;line-height:1.55}
.rule{height:1px;background:var(--hairline-2);margin:16px 0}

/* ---------- stat tiles ---------- */
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-top:16px}
.tile{
  background:var(--surface);border:1px solid var(--hairline-2);border-radius:var(--radius);
  padding:16px 16px 14px;
}
.tile .t-label{font-size:12px;color:var(--muted);font-weight:500}
.tile .t-value{font-size:31px;font-weight:600;letter-spacing:-.025em;line-height:1.1;margin-top:8px}
.tile .t-sub{font-size:12px;color:var(--ink-2);margin-top:6px}
.tile .spark{margin-top:10px;height:26px}

/* ---------- toggles ---------- */
.seg{display:inline-flex;border:1px solid var(--hairline);border-radius:999px;padding:2px;background:var(--surface-2);gap:2px}
.seg button{
  border:0;background:transparent;color:var(--ink-2);font:inherit;font-size:12px;
  padding:5px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;
}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* ---------- legend ---------- */
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:2px;margin-bottom:14px}
.legend .item{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2)}
.legend .swatch{width:11px;height:11px;border-radius:3px;flex:none}

/* ---------- tables ---------- */
details.table-view{margin-top:16px;border-top:1px solid var(--hairline-2);padding-top:12px}
details.table-view summary{
  font-size:12px;color:var(--muted);cursor:pointer;list-style:none;
  display:inline-flex;align-items:center;gap:6px;
}
details.table-view summary::-webkit-details-marker{display:none}
details.table-view summary::before{content:"▸";font-size:10px;transition:transform .15s}

table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:340px}

.fn-card .fn-title h3{font-size:16px}
.fn-stats{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px}
.fn-stats div{min-width:0}
.fn-stats .n{font-size:20px;font-weight:600;letter-spacing:-.02em}
.fn-stats .l{font-size:11.5px;color:var(--muted);margin-top:2px}
.mini-rows{margin-top:16px;display:flex;flex-direction:column;gap:9px}
.mini-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;font-size:12.5px}
.mini-row .name{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-row .val{color:var(--muted);font-size:11.5px}
.mini-track{grid-column:1/-1;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.mini-fill{display:block;height:100%;border-radius:3px;background:var(--accent)}
.subhead{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:18px}

/* ---------- lists ---------- */
.list-rows{display:flex;flex-direction:column;gap:11px}
.list-row{display:grid;grid-template-columns:minmax(0,1fr) 84px 40px;gap:12px;align-items:center;font-size:13px}
.list-row .bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.list-row .bar i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.list-row .n{text-align:right;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.list-row .k{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.list-row .k .ppl{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1 1 auto}
.mini-chip{

.list-row.muted .k .nm{color:var(--muted)}
.list-row.muted .bar i{background:var(--muted);opacity:.55}
.list-row.muted .n{color:var(--muted);opacity:.8}
.list-row.roomy{grid-template-columns:minmax(0,1fr) 60px 34px}

.surprise .quote{font-size:15px;line-height:1.45;letter-spacing:-.01em}
.surprise .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.tag{

.tag .dot{width:7px;height:7px;border-radius:50%;flex:none}
.tag.soft{border-color:transparent;background:var(--surface-2);color:var(--muted)}

/* ---------- patterns ---------- */
.patterns{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.pattern{
  background:var(--surface);border:1px solid var(--hairline-2);border-radius:var(--radius);

  font-size:11px;font-weight:600;display:grid;place-items:center;margin-top:1px;

/* ---------- footer ---------- */

/* ---------- tooltip ---------- */
#tip{
  position:fixed;z-index:60;pointer-events:none;opacity:0;transition:opacity .1s;
  background:var(--surface);color:var(--ink);border:1px solid var(--hairline);
  border-radius:10px;padding:9px 11px;font-size:12.5px;line-height:1.45;

#tip .tr{color:var(--ink-2);display:flex;gap:10px;justify-content:space-between}
#tip .tr b{font-weight:600;color:var(--ink)}

.empty{color:var(--muted);font-size:13px;padding:8px 0}
.hidden{display:none !important}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}

  return String(Math.round(n * 10) / 10);
}

  n = num(n);

  var m = /^#?([0-9a-f]{6})$/i.exec(String(hex).trim());

  var v = parseInt(m[1], 16);
  var c = [(v>>16)&255, (v>>8)&255, v&255].map(function(x){

/* rounded rect path; r = [tl,tr,br,bl] */
function rr(x, y, w, h_, r){
  w = Math.max(0, w); h_ = Math.max(0, h_);
  var m = Math.min(w, h_) / 2;
  var a = Math.max(0, Math.min(r[0], m)), b = Math.max(0, Math.min(r[1], m)),
      c = Math.max(0, Math.min(r[2], m)), d = Math.max(0, Math.min(r[3], m));
  return 'M' + (x+a) + ',' + y +
    'H' + (x+w-b) + (b ? 'A' + b + ',' + b + ' 0 0 1 ' + (x+w) + ',' + (y+b) : '') +
    'V' + (y+h_-c) + (c ? 'A' + c + ',' + c + ' 0 0 1 ' + (x+w-c) + ',' + (y+h_) : '') +

}

var TIP = document.getElementById('tip');
function tipShow(html, ev){

function tipMove(ev){
  if (!ev) return;
  var pad = 14, r = TIP.getBoundingClientRect();
  var x = ev.clientX + pad, y = ev.clientY + pad;
  if (x + r.width > window.innerWidth - 8) x = ev.clientX - r.width - pad;

  TIP.style.top = Math.max(8, y) + 'px';
}
function tipHide(){ TIP.style.opacity = '0'; }

function sparkline(node, w, hgt, vals){
  var svg = S('svg', { width:w, height:hgt, viewBox:'0 0 ' + w + ' ' + hgt }, node);
  var max = Math.max.apply(null, vals.concat([1]));
  var min = Math.min.apply(null, vals.concat([max]));
  var span = Math.max(1, max - min * 0.85);
  var pad = 3;
  var pts = vals.map(function(v, i){
    var x = vals.length === 1 ? w/2 : (i / (vals.length - 1)) * (w - 6) + 3;
    var y = hgt - pad - ((v - min*0.85) / span) * (hgt - pad*2);
    return [x, y];
  });
  S('path', {
    d: pts.map(function(p, i){ return (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(''),
    fill:'none', stroke: css('--accent'), 'stroke-width':2,
    'stroke-linecap':'round', 'stroke-linejoin':'round', opacity:.85
  }, svg);
  var last = pts[pts.length - 1];
  S('circle', { cx:last[0], cy:last[1], r:4, fill: css('--accent'), stroke: css('--surface'), 'stroke-width':2 }, svg);
}

  /* chips from highlights */

  if (teamTotal) mixRows.push({ label:'Whole team', mix:teamMix, total:teamTotal, lead:true });
  BY_FUNCTION.forEach(function(f){
    var m = obj(f.assist_type_mix);
    var t = ASSIST_KEYS.reduce(function(a, k){ return a + num(m[k]); }, 0);

  if (mixRows.length){

        h('h3', { text:'Is AI informing people, or doing things for them?' }),

    })));
    var plot = h('div'); card.appendChild(plot);
    mountChart(plot, function(node, w){
      var inline = w >= 520;
      var labelW = inline ? Math.min(150, Math.round(w * 0.22)) : 0;
      var valW = inline ? 62 : 52;

      var svg = S('svg', { width:w, height:hgt, viewBox:'0 0 ' + w + ' ' + hgt }, node);

      mixRows.forEach(function(row, i){
        var y = 4 + i * (rowH + gap), barY = y + labelH;

          weight: row.lead ? 600 : 400
        });
        else txt(svg, 0, y + 11, row.label, { fill: css('--ink'), size:12.5, weight: row.lead ? 600 : 500 });

        var x = plotX;
        var present = ASSIST_KEYS.filter(function(k){ return num(row.mix[k]) > 0; });
        present.forEach(function(k, ki){
          var frac = num(row.mix[k]) / row.total;
          var segW = frac * plotW;
          var first = ki === 0, last = ki === present.length - 1;
          var drawW = last ? segW : Math.max(0, segW - 2);
          var fill = css(ASSIST_VARS[k]);
          var p = S('path', {
            d: rr(x, barY, drawW, barH, [first?4:0, last?4:0, last?4:0, first?4:0]),
            fill: fill
          }, svg);
          bindTip(p, (function(row, k, frac){ return function(){
            return tipHTML(row.label + ' · ' + assistLabel(k), [
              ['Sessions', fmt(row.mix[k])],
              ['Share', pct(frac, 1)],
              ['Classified sessions', fmt(row.total)]
            ]);
          }; })(row, k, frac));
          var lbl = pct(frac);
          if (drawW > textW(lbl, 11.5) + 16){
            txt(svg, x + drawW/2, barY + barH/2 + .5, lbl, {
              fill: inkOn(fill), size:11.5, anchor:'middle', baseline:'middle', weight:600, tnum:true
            });
          }
          x += segW;
        });
        txt(svg, plotX + plotW + 10, barY + barH/2, fmt(row.total), {
          fill: css('--muted'), size:11.5, baseline:'middle', tnum:true
        });
      });
    });
    card.appendChild(tableView('Table view', ['Group'].concat(ASSIST_KEYS.map(assistLabel)).concat(['Total']),
      mixRows.map(function(r){
        return [r.label].concat(ASSIST_KEYS.map(function(k){
          return fmt(r.mix[k]) + ' (' + pct(num(r.mix[k]) / r.total) + ')';
        })).concat([fmt(r.total)]);
      })));
    sec.appendChild(card);
  }

  /* per-function cards */
  if (BY_FUNCTION.length){
    var grid = h('div', { class:'grid g-auto', style:'margin-top:16px' });
    /* one shared scale across every function card, so the cards compare */
    var maxShare = 0.0001, srcMax = 1;
    BY_FUNCTION.forEach(function(f){
      arr(f.top_categories).forEach(function(c){ maxShare = Math.max(maxShare, num(c.share)); });
      var so = obj(f.by_source);
      Object.keys(so).forEach(function(k){ srcMax = Math.max(srcMax, num(so[k])); });
    });
    BY_FUNCTION.forEach(function(f){
      var color = fnColor(f.function);
      var cats = arr(f.top_categories).slice(0, 5);
      var srcObj = obj(f.by_source);
      var srcKeys = Object.keys(srcObj).sort(function(a,b){ return num(srcObj[b]) - num(srcObj[a]); }).slice(0, 5);

      var card = h('div', { class:'card fn-card' }, [
        h('div', { class:'fn-title' }, [
          h('span', { class:'dot', style:'background:' + color }),
          h('h3', { text: str(f.function) || '—' })
        ]),
        h('div', { class:'fn-stats' }, [
          h('div', {}, [ h('div', { class:'n', text: fmt(f.participants) }), h('div', { class:'l', text:'people' }) ]),
          h('div', {}, [ h('div', { class:'n', text: compact(f.sessions) }), h('div', { class:'l', text:'sessions' }) ]),
          h('div', {}, [ h('div', { class:'n', text: dec(f.sessions_per_person_per_week) }), h('div', { class:'l', text:'/ person / week' }) ])
        ]),
        cats.length ? h('div', { class:'subhead', text:'Top use cases' }) : null,
        cats.length ? h('div', { class:'mini-rows' }, cats.map(function(c){
          return h('div', { class:'mini-row' }, [
            h('span', { class:'name', text: str(c.category) || '—' }),
            h('span', { class:'val tnum', text: pct(c.share) }),
            h('span', { class:'mini-track' }, [
              h('i', { class:'mini-fill', style:'width:' + Math.max(2, (num(c.share)/maxShare) * 100) + '%;background:' + color })
            ])
          ]);
        })) : null,
        srcKeys.length ? h('div', { class:'subhead', text:'Where those sessions happen' }) : null,
        srcKeys.length ? h('div', { class:'mini-rows' }, srcKeys.map(function(k){
          return h('div', { class:'mini-row' }, [
            h('span', { class:'name', text: srcLabel(k) }),
            h('span', { class:'val tnum', text: fmt(srcObj[k]) }),
            h('span', { class:'mini-track' }, [
              h('i', { class:'mini-fill', style:'width:' + Math.max(2, (num(srcObj[k])/srcMax) * 100) + '%;background:' + css('--muted') })
            ])
          ]);
        })) : null
      ]);
      grid.appendChild(card);
      /* keep colors live across theme changes */
      tint(function(){
        var c = fnColor(f.function);
        var dot = card.querySelector('.fn-title .dot'); if (dot) dot.style.background = c;
        card.querySelectorAll('.mini-fill').forEach(function(el, i){
          el.style.background = i < cats.length ? c : css('--muted');
        });
      });
    });
    sec.appendChild(grid);
  }

  app.appendChild(sec);
})();

        })));

/* ================= 5. when ================= */
(function when(){
  if (!BY_WEEK.length && !BY_WEEKDAY.length && !BY_HOUR.length) return;
  var sec = h('section', {}, secHead('When', 'When the work happens',
    'Weekly volume over the window, then the shape of a typical week and a typical day.'));

  if (BY_WEEK.length){
    var card = h('div', { class:'card' }, [
      h('div', { class:'card-head' }, [ h('div', {}, [
        h('h3', { text:'Sessions by week' }),
        h('div', { class:'card-sub', text:'Active participants shown under each week' })
      ]) ])
    ]);
    var plot = h('div'); card.appendChild(plot);
    mountChart(plot, function(node, w){
      var rows = BY_WEEK;
      var vals = rows.map(function(r){ return num(r.sessions); });
      var maxV = Math.max.apply(null, vals.concat([1]));
      var top = Math.ceil(maxV / 50) * 50 || maxV;
      var topPad = 26, plotH = 150, axisH = 46;
      var hgt = topPad + plotH + axisH;
      var padL = 2, padR = 2;
      var innerW = Math.max(40, w - padL - padR);
      var band = innerW / Math.max(1, rows.length);
      var X = function(i){ return padL + (rows.length === 1 ? innerW/2 : band * i + band/2); };
      var base = topPad + plotH;
      var Y = function(v){ return base - (num(v) / top) * plotH; };
      var svg = S('svg', { width:w, height:hgt, viewBox:'0 0 ' + w + ' ' + hgt }, node);

      [0.5, 1].forEach(function(f){
        S('line', { x1:0, y1:base - plotH*f + .5, x2:w, y2:base - plotH*f + .5, stroke: css('--grid'), 'stroke-width':1 }, svg);
      });
      S('line', { x1:0, y1:base + .5, x2:w, y2:base + .5, stroke: css('--axis'), 'stroke-width':1 }, svg);
      txt(svg, 0, base - plotH - 7, fmt(top), { fill: css('--muted'), size:10.5, tnum:true });
      txt(svg, 0, base - plotH/2 - 5, fmt(Math.round(top/2)), { fill: css('--muted'), size:10.5, tnum:true });

      if (rows.length > 1){
        var line = rows.map(function(r, i){ return (i ? 'L' : 'M') + X(i).toFixed(1) + ',' + Y(r.sessions).toFixed(1); }).join('');
        S('path', { d: line + 'L' + X(rows.length-1).toFixed(1) + ',' + base + 'L' + X(0).toFixed(1) + ',' + base + 'Z',
          fill: css('--s1'), opacity:.10 }, svg);
        S('path', { d: line, fill:'none', stroke: css('--s1'), 'stroke-width':2,
          'stroke-linecap':'round', 'stroke-linejoin':'round' }, svg);
      }

      var maxIdx = 0;
      vals.forEach(function(v, i){ if (v > vals[maxIdx]) maxIdx = i; });

      rows.forEach(function(r, i){
        var cx = X(i), cy = Y(r.sessions);
        var isKey = i === maxIdx || i === rows.length - 1;
        var g = S('g', {}, svg);
        S('circle', { cx:cx, cy:cy, r:5, fill: css('--s1'), stroke: css('--surface'), 'stroke-width':2 }, g);
        var hit = S('circle', { cx:cx, cy:cy, r:Math.max(14, band/2), fill:'transparent', tabindex:0 }, g);
        bindTip(hit, (function(r){ return function(){
          return tipHTML('Week of ' + dateLabel(r.week_start), [
            ['Sessions', fmt(r.sessions)],
            num(r.active_participants) ? ['Active participants', fmt(r.active_participants)] : null,
            num(r.active_participants) ? ['Per active person', dec(num(r.sessions)/Math.max(1,num(r.active_participants)))] : null
          ]);
        }; })(r));
        if (isKey) txt(svg, cx, cy - 13, fmt(r.sessions), {
          fill: css('--ink'), size:12, anchor:'middle', weight:600, tnum:true });
        txt(svg, cx, base + 17, dateLabel(r.week_start), { fill: css('--ink-2'), size:11.5, anchor:'middle' });
        if (num(r.active_participants)) txt(svg, cx, base + 33, fmt(r.active_participants) + ' active', { fill: css('--muted'), size:10.5, anchor:'middle', tnum:true });
      });
    });
    card.appendChild(tableView('Table view', ['Week of', 'Sessions', 'Active participants'],
      BY_WEEK.map(function(r){ return [dateLabel(r.week_start), fmt(r.sessions), num(r.active_participants) ? fmt(r.active_participants) : '—']; })));
    sec.appendChild(card);
  }

  var grid = h('div', { class:'grid g2', style:'margin-top:16px' });

  function stripCard(title, sub, items, labelOf, valueOf, opts){
    opts = opts || {};
    var card = h('div', { class:'card' }, [
      h('div', { class:'card-head' }, [ h('div', {}, [
        h('h3', { text:title }), h('div', { class:'card-sub', text:sub })
      ]) ])
    ]);
    var plot = h('div'); card.appendChild(plot);
    mountChart(plot, function(node, w){
      var maxV = Math.max.apply(null, items.map(valueOf).concat([1]));
      var topPad = 22, plotH = opts.h || 110, axisH = 22;
      var hgt = topPad + plotH + axisH;
      var band = w / items.length;
      var barW = Math.min(opts.maxBar || 24, Math.max(4, band - (opts.gapPx || 8)));
      var svg = S('svg', { width:w, height:hgt, viewBox:'0 0 ' + w + ' ' + hgt }, node);
      var base = topPad + plotH;
      S('line', { x1:0, y1:base + .5, x2:w, y2:base + .5, stroke: css('--axis'), 'stroke-width':1 }, svg);
      var peak = 0;
      items.forEach(function(it, i){ if (valueOf(it) > valueOf(items[peak])) peak = i; });
      items.forEach(function(it, i){
        var v = valueOf(it), bh = (v / maxV) * plotH;
        var cx = band * i + band/2, x = cx - barW/2, y = base - bh;
        if (v > 0){
          var p = S('path', { d: rr(x, y, barW, bh, [3,3,0,0]), fill: css('--s1'), opacity: i === peak ? 1 : .5 }, svg);
          bindTip(p, (function(it, v){ return function(){
            return tipHTML(opts.tipTitle ? opts.tipTitle(it) : labelOf(it), [
              ['Sessions', fmt(v)],
              ['Share', pct(v / Math.max(1, items.reduce(function(a,x2){ return a + valueOf(x2); }, 0)))]
            ]);
          }; })(it, v));
        }
        if (i === peak && v > 0) txt(svg, cx, y - 8, fmt(v), { fill: css('--ink'), size:11.5, anchor:'middle', weight:600, tnum:true });
        var show = !opts.every || (i % opts.every === 0);
        if (show) txt(svg, cx, base + 15, labelOf(it), { fill: css('--muted'), size:10.5, anchor:'middle' });
      });
    });
    return card;
  }

  if (BY_WEEKDAY.length){
    var wd = BY_WEEKDAY.slice().sort(function(a,b){ return num(a.weekday) - num(b.weekday); });
    grid.appendChild(stripCard('By weekday', 'Sessions across the whole window', wd,
      function(d){ return str(d.label) || String(num(d.weekday)); },
      function(d){ return num(d.sessions); }, { maxBar:24, gapPx:14 }));
  }
  if (BY_HOUR.length){
    var hr = BY_HOUR.slice().sort(function(a,b){ return num(a.hour) - num(b.hour); });
    grid.appendChild(stripCard('By hour of day', 'Local time on each person’s machine', hr,
      function(d){ return hourLabel(d.hour); },
      function(d){ return num(d.sessions); },
      { maxBar:14, gapPx:4, every:3, tipTitle:function(d){ return hourLabel(d.hour) + ' – ' + hourLabel((num(d.hour)+1)%24); } }));
  }
  if (grid.children.length) sec.appendChild(grid);
  app.appendChild(sec);
})();

/* ================= 6. surprises ================= */
(function surprises(){

  var sec = h('section', {}, secHead('Steal this', 'Surprising ways people use AI',
    'Sessions the classifier flagged as outside what the role predicts. This is the list to learn from each other.'));
  var grid = h('div', { class:'surprise-grid' });
  var seen = {};
  var uniq = SURPRISES.filter(function(s){
    var k = (str(s.paraphrase) + '|' + str(s.function)).toLowerCase();
    if (seen[k]) return false;
    seen[k] = 1; return true;
  });
  uniq.slice(0, 12).forEach(function(s){
    var fn = str(s.function);
    var card = h('div', { class:'surprise' }, [
      h('p', { class:'quote', text: str(s.paraphrase) || '—' }),
      h('div', { class:'tags' }, [
        fn ? h('span', { class:'tag' }, [
          h('span', { class:'dot', style:'background:' + fnColor(fn) }),
          document.createTextNode(fn)
        ]) : null,
        str(s.category) ? h('span', { class:'tag soft', text: s.category }) : null,
        str(s.source) ? h('span', { class:'tag soft', text: srcLabel(s.source) }) : null
      ])
    ]);
    grid.appendChild(card);
    tint(function(){
      var d = card.querySelector('.tag .dot'); if (d) d.style.background = fnColor(fn);
    });
  });
  sec.appendChild(grid);
  app.appendChild(sec);
})();

/* ================= 7. patterns ================= */
(function patterns(){
  var ps = arr(NAR.patterns).map(str).filter(Boolean);
  if (!ps.length) return;
  var sec = h('section', {}, secHead('So what', 'Patterns worth a conversation', null));
  sec.appendChild(h('div', { class:'patterns' }, ps.map(function(p, i){
    return h('div', { class:'pattern' }, [
      h('span', { class:'idx', text: String(i + 1) }),
      h('span', { text:p })
    ]);
  })));
  app.appendChild(sec);
})();

/* ================= footer ================= */
(function foot(){
  var gen = str(D.generated_at);
  var genTxt = '';
  if (gen){
    var d = new Date(gen);
    genTxt = isNaN(d) ? gen : d.toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });
  }
  app.appendChild(h('footer', {}, [
    h('span', { text:'Made with how-i-ai · anonymized team data' }),
    h('span', { text: [ genTxt ? 'Generated ' + genTxt : '', str(TEAM.name) ].filter(Boolean).join(' · ') })
  ]));
})();

/* ================= theme ================= */
(function theme(){
  var btn = document.getElementById('themeBtn');
  var root = document.documentElement;
  var mql = window.matchMedia('(prefers-color-scheme: dark)');
  function current(){
    var t = root.getAttribute('data-theme');
    if (t === 'light' || t === 'dark') return t;
    return mql.matches ? 'dark' : 'light';
  }
  function paint(){ if (btn) btn.textContent = current() === 'dark' ? 'Light' : 'Dark'; drawAll(); }
  if (btn) btn.addEventListener('click', function(){
    root.setAttribute('data-theme', current() === 'dark' ? 'light' : 'dark');
    paint();
  });
  if (mql.addEventListener) mql.addEventListener('change', paint);
  else if (mql.addListener) mql.addListener(paint);
  paint();
})();

drawAll();
/* one more pass after layout settles (fonts/scrollbars) */
requestAnimationFrame(drawAll);

})();
</script>
