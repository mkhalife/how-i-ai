    var order = ["ask", "make", "do"];
    var lg = legendSwatches(order.map(function (t) { return { color: assistColor(t), label: assistLabel(t).toLowerCase() }; }));
    lg.style.marginLeft = "4px";
    var p = panel({
      title: "categories",
      span: "s7",
      legend: lg,
      meta: high.biggest_use_case ? "top: " + high.biggest_use_case : categories.length + " kinds of work"
    });

    var tot = sum(categories, "sessions") || totalSessions || 1;
    var head = el("div", "colhead");
    head.style.gridTemplateColumns = "44px 1fr 46px";
    head.appendChild(el("span", null, "share"));
    head.appendChild(el("span", null, "category"));
    var sn = el("span", null, "n"); sn.style.textAlign = "right"; head.appendChild(sn);
    p.body.appendChild(head);

    var rows = el("div", "rows");
    var max = maxOf(categories, "sessions") || 1;
    categories.forEach(function (c) {
      var share = (c.share !== undefined && c.share !== null) ? c.share : (Number(c.sessions) || 0) / tot;
      var r = el("div", "row");
      r.style.gridTemplateColumns = "44px 1fr 46px";
      r.style.alignItems = "start";
      r.style.paddingTop = "7px";
      r.style.paddingBottom = "7px";

      var pc = el("div", "pc", pct(share));
      pc.style.textAlign = "left";
      pc.style.color = "var(--ink-2)";
      pc.style.paddingTop = "1px";
      r.appendChild(pc);

      var mid = el("div");
      mid.appendChild(el("div", "nm", c.category));

      var mix = c.assist_type_mix || null;
      var widthPct = (Number(c.sessions) || 0) / max * 100;
      var track = el("div");
      track.style.width = widthPct.toFixed(1) + "%";
      track.style.marginTop = "4px";
      var seg = el("div", "seg");
      if (mix) {
        var mtot = order.reduce(function (a, k) { return a + (Number(mix[k]) || 0); }, 0) || 1;
        order.forEach(function (k) {
          var v = Number(mix[k]) || 0;
          if (!v) return;
          var i2 = el("i");
          i2.style.width = (v / mtot * 100).toFixed(2) + "%";
          i2.style.background = assistColor(k);
          seg.appendChild(i2);
        });
      } else {
        var i3 = el("i");
        i3.style.width = "100%";
        i3.style.background = "var(--accent-dim)";
        seg.appendChild(i3);
      }
      track.appendChild(seg);
      mid.appendChild(track);

      if (has(c.subcategories)) {
        var sub = el("div", "hint", c.subcategories.map(function (s) {
          return s.name + " " + s.sessions;
        }).join("  ·  "));
        sub.style.marginTop = "4px";
        mid.appendChild(sub);
      }
      r.appendChild(mid);

      var n = el("div", "nu", num(c.sessions));
      n.style.paddingTop = "1px";
      r.appendChild(n);

      var tipTxt = c.category + "\n" + num(c.sessions) + " sessions · " + pct(share);
      if (mix) tipTxt += "\n" + order.filter(function (k) { return mix[k]; })
        .map(function (k) { return "  " + assistLabel(k).toLowerCase() + " " + mix[k]; }).join("\n");
      bindTip(r, tipTxt);
      rows.appendChild(r);
    });
    p.body.appendChild(rows);
  })();

  /* ================= 7. ASK / MAKE / DO ================= */
  if (assist.length) (function () {
    var p = panel({ title: "ask · make · do", parent: rightColumn(), meta: "who did the work" });
    var tot = sum(assist, "sessions") || totalSessions || 1;
    var order = ["ask", "make", "do"];
    var sorted = order.map(function (t) {
      for (var i = 0; i < assist.length; i++) if (assist[i].type === t) return assist[i];
      return null;
    }).filter(Boolean);
    assist.forEach(function (a) { if (order.indexOf(a.type) === -1) sorted.push(a); });

    var g = el("div", "gauge");
    sorted.forEach(function (a) {
      var share = (a.share !== undefined && a.share !== null) ? a.share : (Number(a.sessions) || 0) / tot;
      var i2 = el("i");
      i2.style.width = (share * 100).toFixed(2) + "%";
      i2.style.background = assistColor(a.type);
      bindTip(i2, (a.label || assistLabel(a.type)) + "\n" + num(a.sessions) + " sessions · " + pct(share));
      g.appendChild(i2);
    });
    p.body.appendChild(g);

    var rows = el("div", "rows");
    var DESC = {
      ask: "wanted words back — advice, an explanation, a review",
      make: "wanted an artifact — a doc, a plan, code, a design",
      do: "let AI act — files edited, commands run, things changed"
    };
    sorted.forEach(function (a) {
      var share = (a.share !== undefined && a.share !== null) ? a.share : (Number(a.sessions) || 0) / tot;
      var r = el("div", "row");
      r.style.gridTemplateColumns = "13px 1fr 46px 50px";
      r.style.alignItems = "start";
      r.style.paddingTop = "7px";
      r.style.paddingBottom = "7px";
      var sw = el("i", "sw");
      sw.style.background = assistColor(a.type);
      sw.style.marginTop = "5px";
      r.appendChild(sw);
      var mid = el("div");
      mid.appendChild(el("div", "nm", a.label || assistLabel(a.type)));
      if (DESC[a.type]) {
        var d = el("div", "hint", DESC[a.type]);
        d.style.marginTop = "1px";
        mid.appendChild(d);
      }
      r.appendChild(mid);
      var n = el("div", "nu", num(a.sessions)); n.style.paddingTop = "1px"; r.appendChild(n);
      var q = el("div", "pc", pct(share)); q.style.paddingTop = "2px"; r.appendChild(q);
      rows.appendChild(r);
    });
    p.body.appendChild(rows);
  })();

  /* ================= 7b. SHAPE: mode + session length ================= */
  if (modes.length || (slen && has(slen.buckets))) (function () {
    var p = panel({ title: "session shape", parent: rightColumn(), meta: "length + mode" });

    if (modes.length) {
      var mtot = sum(modes, "sessions") || 1;
      var g = el("div", "gauge");
      g.style.height = "14px";
      g.style.marginBottom = "8px";
      var steps = ["var(--h5)", "var(--h3)", "var(--h1)"];
      modes.forEach(function (m, i) {
        var i2 = el("i");
        i2.style.width = ((Number(m.sessions) || 0) / mtot * 100).toFixed(2) + "%";
        i2.style.background = steps[i % steps.length];
        bindTip(i2, m.mode + "\n" + num(m.sessions) + " sessions · " + pct((Number(m.sessions) || 0) / mtot));
        g.appendChild(i2);
      });
      p.body.appendChild(g);
      var leg = el("div", "legend");
      leg.style.marginBottom = "12px";
      modes.forEach(function (m, i) {
        var s = el("span");
        var sw = el("i", "sw");
        sw.style.background = steps[i % steps.length];
        s.appendChild(sw);
        s.appendChild(el("span", null, m.mode + " " + pct((Number(m.sessions) || 0) / mtot)));
        leg.appendChild(s);
      });
      p.body.appendChild(leg);
    }

    if (slen && has(slen.buckets)) {
      var b = slen.buckets;
      var max = maxOf(b, "sessions") || 1;
      var lab = el("div", "striplab", "messages per session");
      lab.style.marginBottom = "6px";
      p.body.appendChild(lab);
      var rows = el("div", "rows");
      b.forEach(function (d) {
        var r = el("div", "row");
        r.style.gridTemplateColumns = "72px 1fr 40px";
        r.appendChild(el("div", "nm", d.label));
        var bw = el("div");
        var bar = el("div", "bar");
        var fill = el("i");
        fill.style.width = ((Number(d.sessions) || 0) / max * 100).toFixed(1) + "%";
        bar.appendChild(fill);
        bw.appendChild(bar);
        r.appendChild(bw);
        r.appendChild(el("div", "nu", num(d.sessions)));
        bindTip(r, d.label + " messages\n" + num(d.sessions) + " sessions");
        rows.appendChild(r);
      });
      p.body.appendChild(rows);
      var bits = [];
      if (slen.median_messages !== undefined) bits.push("median " + num(slen.median_messages));
      if (slen.p90_messages !== undefined) bits.push("p90 " + num(slen.p90_messages));
      if (bits.length) {
        var f = el("div", "hint", bits.join("  ·  ") + " messages");
        f.style.marginTop = "9px";
        f.style.paddingTop = "8px";
        f.style.borderTop = "1px solid var(--border)";
        p.body.appendChild(f);
      }
    }
  })();

  /* ================= 8. TOOLS / CONNECTORS / MODELS / SKILLS / AGENTS ================= */
  (function () {
    var groups = [];
    if (tools.length) groups.push({ title: "top processes", meta: "built-in tools", items: tools, unit: "sessions", noun: "tools" });
    if (connectors.length) groups.push({ title: "connectors", meta: "mcp servers", items: connectors, unit: "sessions", noun: "connectors" });
    if (models.length) groups.push({ title: "models", meta: "engines used", items: models, unit: "sessions", noun: "models" });
    if (skills.length) groups.push({ title: "skills", meta: "/invocations", items: skills, unit: "sessions", noun: "skills" });
    if (agents.length) groups.push({ title: "agents", meta: "spawned", items: agents, unit: "sessions", noun: "agents", isAgents: true });
    if (!groups.length) return;

    var procRow = el("div", "procrow s12");
    app.appendChild(procRow);

    function renderGroup(g, parent) {
      var p = panel({ title: g.title, meta: g.meta, parent: parent });
      var items = g.items.slice(0, 10);
      var max = maxOf(items, "sessions") || 1;
      var COLS = "22px 1fr 96px 34px";
      var head = el("div", "colhead");
      head.style.gridTemplateColumns = COLS;
      head.appendChild(el("span", null, "#"));
      head.appendChild(el("span", null, "name"));
      head.appendChild(el("span", null, ""));
      var sh = el("span", null, "n"); sh.style.textAlign = "right"; head.appendChild(sh);
      p.body.appendChild(head);

      var rows = el("div", "rows");
      items.forEach(function (it, i) {
        var r = el("div", "row");
        r.style.gridTemplateColumns = COLS;
        r.appendChild(el("div", "idx", (i + 1 < 10 ? "0" : "") + (i + 1)));
        var nm = el("div", "nm");
        nm.appendChild(document.createTextNode(it.name));
        if (g.isAgents && it.custom) {
          var tag = el("span", null, " [custom]");
          tag.style.color = "var(--ink-3)";
          nm.appendChild(tag);
        }
        r.appendChild(nm);
        var barwrap = el("div");
        var bar = el("div", "bar");
        var fill = el("i");
        fill.style.width = ((Number(it.sessions) || 0) / max * 100).toFixed(1) + "%";
        bar.appendChild(fill);
        barwrap.appendChild(bar);
        r.appendChild(barwrap);
        var n = el("div", "nu", num(it.sessions));
        n.style.fontSize = "11.5px";
        r.appendChild(n);
        var share = totalSessions ? (Number(it.sessions) || 0) / totalSessions : null;
        bindTip(r, it.name + (g.isAgents && it.custom ? " [custom]" : "") + "\n" + num(it.sessions) + " " + g.unit +
          (share !== null ? "\n" + pct(share) + " of all sessions" : ""));
        rows.appendChild(r);
      });
      p.body.appendChild(rows);
      var footBits = [g.items.length + " " + g.noun];
      if (g.items.length > items.length) footBits.push((g.items.length - items.length) + " more not shown");
      if (items.length) footBits.push("top " + items[0].name + " · " + num(items[0].sessions) + " sessions");
      var foot = el("div", "hint", footBits.join("  ·  "));
      foot.style.marginTop = "10px";
      foot.style.paddingTop = "9px";
      foot.style.borderTop = "1px solid var(--border)";
      p.body.appendChild(foot);
    }

    /* first group stands alone in its own column; the rest pair up into
       stacked columns (2 panels each) so the row stays balanced regardless
       of how many of the five groups are present */
    if (groups.length === 1) {
      renderGroup(groups[0], procRow);
    } else {
      renderGroup(groups[0], procRow);
      var rest = groups.slice(1);
      for (var i = 0; i < rest.length; i += 2) {
        var chunk = rest.slice(i, i + 2);
        if (chunk.length === 1) {
          renderGroup(chunk[0], procRow);
        } else {
          var stack = el("div", "stack");
          procRow.appendChild(stack);
          chunk.forEach(function (g) { renderGroup(g, stack); });
        }
      }
    }
  })();

  /* ================= 10. SURPRISE ================= */
  if (high.surprise || surprises.length) (function () {
    var p = panel({ title: "unexpected", span: "s12", meta: "outside the job description" });
    var grid = el("div", "sgrid");
    p.body.appendChild(grid);
    var box = el("div", "surprise");
    var s = high.surprise || surprises[0];
    box.appendChild(el("div", "tag", "[!] surprise of the month"));
    box.appendChild(el("div", "big", s.paraphrase || ""));
    var meta = [];
    if (s.category) meta.push(s.category);
    if (s.source) meta.push(sourceLabel(s.source));
    if (s.date) meta.push(shortDate(s.date));
    if (meta.length) {
      var m = el("div", "hint", meta.join("  ·  "));
      box.appendChild(m);
    }
    if (s.why) box.appendChild(el("div", "why", s.why));
    grid.appendChild(box);

    var rest = surprises.filter(function (x) {
      return !high.surprise || x.paraphrase !== high.surprise.paraphrase;
    });
    if (rest.length) {
      var list = el("div", "slist");
      var lh = el("div", "striplab", "other sessions nobody predicted");
      lh.style.marginBottom = "3px";
      list.appendChild(lh);
      rest.slice(0, 6).forEach(function (x) {
        var r = el("div");
        r.appendChild(el("span", "d", (x.date ? shortDate(x.date) : "") + "  "));
        r.appendChild(el("span", null, x.paraphrase));
        if (x.category) r.appendChild(el("span", "d", "   " + x.category));
        list.appendChild(r);
      });
      grid.appendChild(list);
    } else {
      grid.style.gridTemplateColumns = "1fr";
    }
  })();

  /* ================= 11. MOMENTS LOG ================= */
  if (samples.length) (function () {
    var p = panel({
      title: "moments",
      span: "s12", tight: true,
      meta: "tail -n " + Math.min(samples.length, 14) + " sessions.log"
    });
    var rows = samples.slice().sort(function (a, b) {
      return String(b.date || "").localeCompare(String(a.date || ""));
    }).slice(0, 14);
    var log = el("div", "log");
    rows.forEach(function (s) {
      var line = el("div", "logline");
      line.appendChild(el("span", "ts", s.date || "—"));
      line.appendChild(el("span", "src", sourceLabel(s.source)));
      var lvl = el("span", "lvl", s.assist_type ? "[" + s.assist_type.toUpperCase() + "]" : "");
      lvl.style.color = s.assist_type ? assistColor(s.assist_type) : "var(--ink-3)";
      if (s.assist_type === "ask") lvl.style.color = "var(--ink-2)";
      line.appendChild(lvl);
      line.appendChild(el("span", "msg", s.paraphrase || ""));
      line.appendChild(el("span", "n", s.messages !== undefined ? s.messages + " msg" : ""));
      bindTip(line, (s.paraphrase || "") + "\n" + [s.category, sourceLabel(s.source), s.date].filter(Boolean).join(" · ") +
        (s.messages !== undefined ? "\n" + s.messages + " messages" : ""));
      log.appendChild(line);
    });
    p.body.appendChild(log);
    var caret = el("div", "caret");
    caret.appendChild(el("span", null, samples.length > 14 ? "… " + (samples.length - 14) + " more sessions in this window " : "end of sample "));
    caret.appendChild(el("span", "cursor"));
    caret.lastChild.style.background = "var(--ink-3)";
    p.body.appendChild(caret);
  })();

  /* ================= 12. NARRATIVE ================= */
  if (narrative.headline || narrative.summary || has(narrative.patterns) || high.signature_move) (function () {
    var p = panel({ title: "readout", span: "s12", meta: "what the month says" });
    if (narrative.headline) p.body.appendChild(el("div", "headline", narrative.headline));
    if (narrative.summary) p.body.appendChild(el("div", "summary", narrative.summary));
    if (has(narrative.patterns)) {
      var ul = el("ul", "patterns");
      narrative.patterns.forEach(function (t) { ul.appendChild(el("li", null, t)); });
      p.body.appendChild(ul);
    }
    if (high.signature_move) {
      var sig = el("div", "sig");
      sig.appendChild(el("b", null, "signature move"));
      sig.appendChild(el("span", null, high.signature_move));
      p.body.appendChild(sig);
    }
  })();

  /* ================= 13. STATUS BAR ================= */
  (function () {
    var bar = document.getElementById("status");
    var left = el("div");
    left.appendChild(el("span", "led"));
    left.appendChild(el("span", null, "made with how-i-ai · data stays on your machine"));
    bar.appendChild(left);

    var right = el("div");
    var bits = [];
    bits.push(num(totalSessions) + " sessions");
    if (win.start && win.end) bits.push(win.start + " → " + win.end);
    if (data.generated_at) bits.push("generated " + String(data.generated_at).slice(0, 16).replace("T", " "));
    bits.push("schema v" + (data.schema_version !== undefined ? data.schema_version : "1"));
    right.appendChild(el("b", null, bits.join("  ·  ")));
    bar.appendChild(right);
  })();
})();
</script>
</body>
</html>
